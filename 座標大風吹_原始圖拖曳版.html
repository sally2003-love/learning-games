<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>座標大風吹－原始圖拖曳版</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#faf8f2;color:#171717}
.app{max-width:1250px;margin:auto;padding:18px}h1{margin:0 0 6px;font-size:clamp(30px,4vw,48px)}.desc{margin:0 0 14px;font-size:17px;line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}button{min-height:44px;border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:800;cursor:pointer}
.primary{background:#2e9f63;color:#fff}.secondary{background:#2c78d5;color:#fff}.danger{background:#e95555;color:#fff}
.status{flex:1;min-width:250px;padding:10px 12px;background:#fff;border:1px solid #d9d2c8;border-radius:12px;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(480px,1fr) minmax(480px,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #d9d2c8;border-radius:18px;padding:16px}.panel h2{margin:0 0 10px;font-size:22px}
.grid-wrap{overflow:auto}.coord-grid{display:grid;grid-template-columns:52px repeat(7,minmax(62px,1fr));grid-template-rows:42px repeat(5,minmax(62px,1fr));min-width:560px}
.head{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px}.cell{border:1.5px solid #333;display:flex;align-items:center;justify-content:center;background:#fff;position:relative;aspect-ratio:1/1}
.symbol,.placed{font-size:clamp(34px,4vw,56px);line-height:1;font-weight:900}.symbol{user-select:none;cursor:grab;touch-action:manipulation}.symbol.selected{outline:4px solid #2f78c8;outline-offset:4px;border-radius:10px}.symbol.done{opacity:.22;cursor:default}
.target .cell{cursor:pointer}.target .cell.dragover{outline:4px solid #6bb45e;outline-offset:-4px}.target .cell.correct{background:#eef8ea}
.check{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#4aa13f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900}
.note{margin-top:10px;font-size:14px;color:#666}.legend{margin-top:12px;padding:10px 12px;background:#fff8df;border-radius:12px;border:1px solid #eadba3;font-size:15px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<h1>🌪️ 座標大風吹</h1>
<p class="desc">請直接從左邊原始圖拖曳符號，放到右邊重新排列後的正確座標。放對後，左邊原符號會淡掉。</p>
<div class="toolbar">
<button id="checkBtn" class="primary">✓ 檢查答案</button>
<button id="resetBtn" class="secondary">↻ 重新開始</button>
<button id="clearBtn" class="danger">清空新格子</button>
<div id="status" class="status">已完成 0 / 27</div>
</div>
<div class="layout">
<section class="panel"><h2>原始圖（直接拖曳）</h2><div class="grid-wrap"><div id="sourceGrid" class="coord-grid source"></div></div><div class="note">也可「點符號 → 點右邊格子」。</div></section>
<section class="panel"><h2>新格子</h2><div class="grid-wrap"><div id="targetGrid" class="coord-grid target"></div></div><div class="legend">欄位：4、2、1、5、6、3、7；列：A、C、D、E、B。</div></section>
</div></div>
<script>
(() => {
const rows=["A","B","C","D","E"], cols=["1","2","3","4","5","6","7"];
const tRows=["A","C","D","E","B"], tCols=["4","2","1","5","6","3","7"];
const map={
A1:"△",A2:"#",A4:"～",A5:"△",A6:"#",A7:"✓",
B1:"✓",B2:"☼",B3:"∅",B4:"△",B7:"～",
C2:"～",C4:"✓",C5:"#",C6:"∅",C7:"△",
D1:"∅",D2:"△",D3:"#",D5:"∅",D6:"✓",D7:"☼",
E1:"☼",E2:"∅",E3:"✓",E4:"～",E6:"#"
};
const source=document.getElementById("sourceGrid"), target=document.getElementById("targetGrid"), status=document.getElementById("status");
let selected=null, dragging=null; const placed=new Set(); const total=Object.keys(map).length;
function head(x){const d=document.createElement("div");d.className="head";d.textContent=x;return d}
function buildSource(){source.innerHTML="";source.appendChild(document.createElement("div"));cols.forEach(c=>source.appendChild(head(c)));
rows.forEach(r=>{source.appendChild(head(r));cols.forEach(c=>{const coord=r+c, cell=document.createElement("div");cell.className="cell";
if(map[coord]){const s=document.createElement("div");s.className="symbol";s.textContent=map[coord];s.draggable=true;s.dataset.coord=coord;s.tabIndex=0;
s.addEventListener("click",()=>{if(placed.has(coord))return;selected=selected===coord?null:coord;refresh();status.textContent=selected?`已選取 ${coord}，請點右邊格子。`:progress()});
s.addEventListener("dragstart",e=>{if(placed.has(coord)){e.preventDefault();return}dragging=coord;e.dataTransfer.setData("text/plain",coord)});
s.addEventListener("dragend",()=>dragging=null);cell.appendChild(s)}source.appendChild(cell)})})}
function buildTarget(){target.innerHTML="";target.appendChild(document.createElement("div"));tCols.forEach(c=>target.appendChild(head(c)));
tRows.forEach(r=>{target.appendChild(head(r));tCols.forEach(c=>{const coord=r+c, cell=document.createElement("button");cell.type="button";cell.className="cell";cell.dataset.coord=coord;
cell.addEventListener("click",()=>{if(selected)place(selected,coord)});
cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("dragover")});
cell.addEventListener("dragleave",()=>cell.classList.remove("dragover"));
cell.addEventListener("drop",e=>{e.preventDefault();cell.classList.remove("dragover");place(e.dataTransfer.getData("text/plain")||dragging,coord)});
target.appendChild(cell)})})}
function place(from,to){if(!from)return;if(from!==to){status.textContent=`❌ ${from} 不屬於 ${to}，再試一次。`;selected=null;refresh();return}
if(placed.has(from))return;placed.add(from);selected=null;const cell=target.querySelector(`[data-coord="${to}"]`);cell.classList.add("correct");cell.innerHTML=`<span class="placed">${map[from]}</span><span class="check">✓</span>`;cell.disabled=true;refresh();status.textContent=placed.size===total?`🎉 全部完成！${total} / ${total}`:"✅ "+progress()}
function refresh(){source.querySelectorAll(".symbol").forEach(s=>{const c=s.dataset.coord;s.classList.toggle("done",placed.has(c));s.classList.toggle("selected",selected===c);s.draggable=!placed.has(c)})}
function progress(){return `已完成 ${placed.size} / ${total}`}
function reset(){placed.clear();selected=null;dragging=null;buildSource();buildTarget();status.textContent=progress()}
document.getElementById("checkBtn").onclick=()=>status.textContent=placed.size===total?`🎉 全部正確！${total} / ${total}`:`目前完成 ${placed.size} 格，還有 ${total-placed.size} 格。`;
document.getElementById("resetBtn").onclick=reset;document.getElementById("clearBtn").onclick=reset;reset();
})();
</script></body></html>
