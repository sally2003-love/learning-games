<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>我的自訂音效猜拳遊戲</title>
    <style>
        body { font-family: 'PingFang TC', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2c3e50; color: white; }
        .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 40px; border-radius: 30px; text-align: center; width: 450px; border: 1px solid rgba(255,255,255,0.2); }
        .score-board { display: flex; justify-content: space-around; font-size: 1.5rem; margin-bottom: 20px; font-weight: bold; }
        .battle-area { display: flex; justify-content: center; align-items: center; gap: 20px; height: 200px; margin: 20px 0; }
        .hand-box { width: 150px; height: 150px; border-radius: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); overflow: hidden; }
        .hand-box img { width: 90%; height: 90%; object-fit: contain; }
        .status-text { font-size: 2rem; font-weight: bold; height: 3rem; margin: 20px 0; transition: 0.3s; }
        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .btn { width: 90px; height: 90px; padding: 10px; border-radius: 15px; background: white; cursor: pointer; border: none; transition: 0.2s; }
        .btn:hover { transform: translateY(-5px); background: #eee; }
        .btn img { width: 100%; height: 100%; object-fit: contain; }
        .pop-anim { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="score-board">
        <div>你: <span id="p-score">0</span></div>
        <div>🤖: <span id="c-score">0</span></div>
    </div>

    <div class="battle-area">
        <div id="p-box" class="hand-box"><span style="font-size: 80px; color: #555;">?</span></div>
        <div style="font-weight: bold; font-size: 1.5rem; color: #95a5a6;">VS</div>
        <div id="c-box" class="hand-box"><span style="font-size: 80px; color: #555;">?</span></div>
    </div>

    <div id="status" class="status-text">準備好了嗎？</div>

    <div class="btn-group">
        <button class="btn" onclick="play('rock')"><img src="rock.png" onerror="this.src='rock.png.png'"></button>
        <button class="btn" onclick="play('scissors')"><img src="scissors.png" onerror="this.src='scissors.png.png'"></button>
        <button class="btn" onclick="play('paper')"><img src="paper.png" onerror="this.src='paper.png.png'"></button>
    </div>
</div>

<script>
    let pScore = 0;
    let cScore = 0;

    // --- 🏆 載入你上傳的音效檔 🏆 ---
    // 贏的音樂
    const sndWin = new Audio('勝利.wav');
    // 輸的音樂
    const sndLose = new Audio('鱉鱉(答錯音效).mp3');
    // 點擊出拳聲 (保留一個基本音效)
    const sndClick = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');

    function play(pMove) {
        sndClick.currentTime = 0;
        sndClick.play();

        const moves = ['rock', 'scissors', 'paper'];
        const cMove = moves[Math.floor(Math.random() * 3)];

        const pBox = document.getElementById('p-box');
        const cBox = document.getElementById('c-box');
        const status = document.getElementById('status');

        const getImg = (move) => `<img src="${move}.png" class="pop-anim" onerror="this.src='${move}.png.png'">`;
        
        pBox.innerHTML = getImg(pMove);
        cBox.innerHTML = getImg(cMove);

        if (pMove === cMove) {
            status.innerText = "平手！🤝";
            status.style.color = "#bdc3c7";
        } else if (
            (pMove === 'rock' && cMove === 'scissors') ||
            (pMove === 'scissors' && cMove === 'paper') ||
            (pMove === 'paper' && cMove === 'rock')
        ) {
            status.innerText = "你贏了！🎉";
            status.style.color = "#2ecc71";
            pScore++;
            // 播放勝利音效
            sndWin.currentTime = 0;
            sndWin.play();
        } else {
            status.innerText = "你輸了...💀";
            status.style.color = "#e74c3c";
            cScore++;
            // 播放輸掉的音效
            sndLose.currentTime = 0;
            sndLose.play();
        }

        document.getElementById('p-score').innerText = pScore;
        document.getElementById('c-score').innerText = cScore;
    }
</script>

</body>
</html>
