<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購物清單記憶遊戲</title>
    <style>
        :root {
            --bg-color: #fff9f0;
            --card-bg: #ffffff;
            --accent-color: #ff8c42;
            --correct-color: #4caf50;
            --error-color: #f44336;
        }

        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #444;
        }

        .container {
            width: 95%;
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }

        h1 { font-size: 24px; margin-bottom: 20px; color: #5d4037; }

        /* 記憶區域樣式 */
        #memory-phase {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .item-display {
            font-size: 80px;
            margin-bottom: 10px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 30px;
        }

        /* 測驗網格樣式 */
        #test-phase {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .grid-item {
            background: white;
            aspect-ratio: 1/1;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.1s;
        }

        .grid-item:active { transform: scale(0.95); }

        /* 回饋層 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 12px;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            pointer-events: none;
        }

        .correct-overlay { background: rgba(76, 175, 80, 0.3); color: #2e7d32; border: 4px solid #4caf50; }
        .error-overlay { background: rgba(244, 67, 54, 0.3); color: #c62828; }

        /* 按鈕樣式 */
        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 140, 66, 0.3);
            font-weight: bold;
        }

        button:hover { filter: brightness(1.1); }

        /* 自定義綠色葡萄繪製 */
        .muscat-icon {
            width: 80px; height: 80px; position: relative;
        }
        .grape-ball {
            width: 25px; height: 25px; background: #c5e1a5;
            border-radius: 50%; border: 1px solid #aed581; position: absolute;
        }
        .stem {
            width: 4px; height: 12px; background: #795548;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        }

        #success-msg {
            display: none;
            font-size: 28px;
            color: var(--correct-color);
            font-weight: bold;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>大購物清單記憶遊戲</h1>

    <div id="memory-phase">
        <div id="item-icon" class="item-display"></div>
        <div id="item-text" class="item-name">點擊下方按鈕開始</div>
        <button id="next-btn" onclick="nextMemorizeItem()">開始記憶</button>
    </div>

    <div id="test-phase">
        <div style="font-size: 18px; color: #666; margin-bottom: 10px;">請依照剛才顯示的順序點擊物品</div>
        <div class="grid" id="item-grid"></div>
        <div id="success-msg">太棒了！全部買齊了！<br><br><button onclick="resetGame()">重新開始</button></div>
    </div>
</div>

<script>
    // 定義物品（葡萄使用特殊 HTML 繪製）
    const muscatHtml = `<div class="muscat-icon">
        <div class="stem"></div>
        <div class="grape-ball" style="top:10px; left:25px;"></div>
        <div class="grape-ball" style="top:15px; left:40px;"></div>
        <div class="grape-ball" style="top:15px; left:10px;"></div>
        <div class="grape-ball" style="top:30px; left:25px;"></div>
        <div class="grape-ball" style="top:35px; left:42px;"></div>
        <div class="grape-ball" style="top:35px; left:8px;"></div>
        <div class="grape-ball" style="top:50px; left:25px;"></div>
    </div>`;

    const items = [
        { id: 1, name: "草莓", icon: "🍓" },
        { id: 2, name: "檸檬果汁", icon: "🍋" },
        { id: 3, name: "紫色葡萄", icon: "🍇" },
        { id: 4, name: "可口可樂", icon: "🥤" },
        { id: 5, name: "汽水", icon: "🍾" },
        { id: 6, name: "綠色葡萄", icon: muscatHtml, isCustom: true },
        { id: 7, name: "蘋果果汁", icon: "🍎" }
    ];

    const distractors = [
        { id: 8, name: "花生醬", icon: "🥜" },
        { id: 9, name: "雞蛋", icon: "🥚" },
        { id: 10, name: "礦泉水", icon: "💧" },
        { id: 11, name: "布丁", icon: "🍮" },
        { id: 12, name: "蔥", icon: "🌿" }
    ];

    let currentMemIndex = -1;
    let currentTestIndex = 0;
    let isGameStarted = false;

    function nextMemorizeItem() {
        if (!isGameStarted) {
            isGameStarted = true;
            document.getElementById('next-btn').innerText = "下一個";
        }
        
        currentMemIndex++;
        
        if (currentMemIndex < items.length) {
            const item = items[currentMemIndex];
            document.getElementById('item-icon').innerHTML = item.icon;
            document.getElementById('item-text').innerText = item.name;
        } else {
            startTestPhase();
        }
    }

    function startTestPhase() {
        document.getElementById('memory-phase').style.display = 'none';
        document.getElementById('test-phase').style.display = 'block';
        
        const allItems = [...items, ...distractors].sort(() => Math.random() - 0.5);
        const grid = document.getElementById('item-grid');
        grid.innerHTML = '';

        allItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'grid-item';
            div.innerHTML = item.icon;
            
            const correctOverlay = document.createElement('div');
            correctOverlay.className = 'overlay correct-overlay';
            correctOverlay.innerText = '○';
            
            const errorOverlay = document.createElement('div');
            errorOverlay.className = 'overlay error-overlay';
            errorOverlay.innerText = '×';
            
            div.appendChild(correctOverlay);
            div.appendChild(errorOverlay);
            
            div.onclick = () => handleItemClick(item, correctOverlay, errorOverlay);
            grid.appendChild(div);
        });
    }

    function handleItemClick(item, correctEl, errorEl) {
        if (currentTestIndex >= items.length) return;

        if (item.id === items[currentTestIndex].id) {
            // 正確
            correctEl.style.display = 'flex';
            currentTestIndex++;
            if (currentTestIndex === items.length) {
                document.getElementById('success-msg').style.display = 'block';
            }
        } else {
            // 錯誤
            errorEl.style.display = 'flex';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 500);
        }
    }

    function resetGame() {
        location.reload();
    }
</script>

</body>
</html>
