<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5以內數量配對｜眼控互動遊戲</title>
  <style>
    :root {
      --bg: #f7f7f2;
      --panel: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #b8b8b8;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --correct: #18864b;
      --correct-soft: #e9f8ef;
      --wrong: #c43c3c;
      --wrong-soft: #fff0f0;
      --focus: #ffb000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 6px solid var(--focus);
      outline-offset: 4px;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 88px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      text-align: center;
    }

    .stat-label {
      color: var(--muted);
      font-size: 18px;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 34px;
      font-weight: 700;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting label {
      font-size: 18px;
      font-weight: 700;
    }

    .setting select {
      width: 100%;
      min-height: 52px;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      font-size: 18px;
    }

    .switch-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      font-size: 19px;
      font-weight: 700;
    }

    .switch-row input {
      width: 30px;
      height: 30px;
    }

    .instruction {
      margin: 16px 0;
      padding: 14px;
      border: 3px solid var(--accent);
      border-radius: 18px;
      background: var(--accent-soft);
      text-align: center;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
    }

    .target-panel {
      min-height: 270px;
      padding: 18px;
      border: 3px solid var(--border);
      border-radius: 22px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .target-label {
      margin-bottom: 12px;
      font-size: clamp(22px, 2.8vw, 32px);
      font-weight: 700;
    }

    .target-number {
      font-size: clamp(110px, 22vw, 190px);
      line-height: 1;
      font-weight: 800;
    }

    .symbol-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(10px, 2vw, 24px);
      max-width: 900px;
    }

    .target-symbol {
      font-size: clamp(68px, 12vw, 118px);
      line-height: 1.05;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }

    .answer-button {
      position: relative;
      min-height: 220px;
      padding: 18px;
      overflow: hidden;
      border: 4px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
      transition:
        border-color 0.15s ease,
        background-color 0.15s ease,
        transform 0.15s ease;
    }

    .answer-button:hover,
    .answer-button.is-gazing {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer-button:active {
      transform: scale(0.99);
    }

    .answer-button.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
    }

    .answer-button.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
    }

    .answer-number {
      font-size: clamp(92px, 17vw, 150px);
      line-height: 1;
      font-weight: 800;
    }

    .answer-symbol {
      font-size: clamp(52px, 8vw, 78px);
      line-height: 1.05;
    }

    .dwell-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      background: #dce6f8;
      pointer-events: none;
    }

    .dwell-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      pointer-events: none;
    }

    .answer-button.is-gazing .dwell-fill {
      animation-name: dwellProgress;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes dwellProgress {
      from { width: 0%; }
      to { width: 100%; }
    }

    .feedback {
      min-height: 80px;
      margin-top: 16px;
      padding: 14px;
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
    }

    .feedback.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
    }

    .feedback.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .control-button {
      min-height: 76px;
      padding: 14px;
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: var(--text);
      font-size: clamp(19px, 2.3vw, 26px);
      font-weight: 700;
      cursor: pointer;
    }

    .control-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    .helper {
      margin: 14px 0 4px;
      color: var(--muted);
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .settings {
        grid-template-columns: repeat(2, 1fr);
      }

      .answer-button {
        min-height: 190px;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding: 10px;
      }

      .top-bar {
        gap: 7px;
      }

      .stat {
        min-height: 72px;
        padding: 8px;
      }

      .stat-label {
        font-size: 15px;
      }

      .stat-value {
        font-size: 27px;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .answer-grid {
        grid-template-columns: 1fr;
      }

      .answer-button {
        min-height: 155px;
      }

      .control-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .answer-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="top-bar" aria-label="遊戲紀錄">
      <div class="stat">
        <div class="stat-label">第幾題</div>
        <div id="roundValue" class="stat-value">1</div>
      </div>

      <div class="stat">
        <div class="stat-label">答對</div>
        <div id="scoreValue" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">連續答對</div>
        <div id="streakValue" class="stat-value">0</div>
      </div>
    </section>

    <section class="settings" aria-label="遊戲設定">
      <div class="setting">
        <label for="modeSelect">練習方式</label>
        <select id="modeSelect">
          <option value="quantity-to-number">看物品選數字</option>
          <option value="number-to-quantity">看數字選物品</option>
          <option value="mixed" selected>混合練習</option>
        </select>
      </div>

      <div class="setting">
        <label for="rangeSelect">數量範圍</label>
        <select id="rangeSelect">
          <option value="2">1～2</option>
          <option value="3">1～3</option>
          <option value="4">1～4</option>
          <option value="5" selected>1～5</option>
        </select>
      </div>

      <div class="setting">
        <label for="categorySelect">素材類別</label>
        <select id="categorySelect">
          <option value="random" selected>三類隨機</option>
          <option value="fruit">水果</option>
          <option value="vehicle">交通工具</option>
          <option value="food">食物</option>
        </select>
      </div>

      <div class="setting">
        <label for="dwellSelect">凝視時間</label>
        <select id="dwellSelect">
          <option value="800">0.8 秒</option>
          <option value="1200">1.2 秒</option>
          <option value="1600" selected>1.6 秒</option>
          <option value="2000">2 秒</option>
          <option value="2500">2.5 秒</option>
        </select>
      </div>

      <label class="switch-row" for="gazeToggle">
        <input id="gazeToggle" type="checkbox" checked />
        開啟眼控凝視選擇：游標停留在答案上即可作答
      </label>
    </section>

    <div id="instruction" class="instruction">
      看一看有幾個，再選出正確的數字。
    </div>

    <section class="target-panel" aria-labelledby="targetLabel">
      <div id="targetLabel" class="target-label">這裡有幾個？</div>
      <div id="targetContent"></div>
    </section>

    <section
      id="answerGrid"
      class="answer-grid"
      aria-label="答案選項"
    ></section>

    <div
      id="feedback"
      class="feedback"
      role="status"
      aria-live="assertive"
    >
      請凝視或點選一個答案。
    </div>

    <section class="control-grid" aria-label="遊戲控制">
      <button id="hintButton" class="control-button" type="button">
        慢慢數一次
      </button>

      <button id="nextButton" class="control-button primary" type="button">
        下一題
      </button>

      <button id="restartButton" class="control-button" type="button">
        重新開始
      </button>
    </section>

    <p class="helper">
      可使用眼控裝置、滑鼠、觸控或鍵盤操作。眼控裝置需先設定成控制滑鼠游標。
      凝視答案時，下方藍色進度條會逐漸填滿。
    </p>
  </main>

  <script>
    "use strict";

    const MATERIALS = {
      fruit: [
        { symbol: "🍎", name: "蘋果" },
        { symbol: "🍌", name: "香蕉" },
        { symbol: "🍊", name: "橘子" },
        { symbol: "🍇", name: "葡萄" },
        { symbol: "🍓", name: "草莓" },
        { symbol: "🍉", name: "西瓜" },
        { symbol: "🍐", name: "梨子" }
      ],

      vehicle: [
        { symbol: "🚗", name: "汽車" },
        { symbol: "🚌", name: "公車" },
        { symbol: "🚕", name: "計程車" },
        { symbol: "🚲", name: "腳踏車" },
        { symbol: "🚂", name: "火車" },
        { symbol: "✈️", name: "飛機" },
        { symbol: "🚢", name: "輪船" }
      ],

      food: [
        { symbol: "🍞", name: "麵包" },
        { symbol: "🍙", name: "飯糰" },
        { symbol: "🍕", name: "披薩" },
        { symbol: "🍔", name: "漢堡" },
        { symbol: "🥟", name: "水餃" },
        { symbol: "🍪", name: "餅乾" },
        { symbol: "🧁", name: "杯子蛋糕" }
      ]
    };

    const CATEGORY_NAMES = {
      fruit: "水果",
      vehicle: "交通工具",
      food: "食物"
    };

    const modeSelect = document.getElementById("modeSelect");
    const rangeSelect = document.getElementById("rangeSelect");
    const categorySelect = document.getElementById("categorySelect");
    const dwellSelect = document.getElementById("dwellSelect");
    const gazeToggle = document.getElementById("gazeToggle");

    const roundValue = document.getElementById("roundValue");
    const scoreValue = document.getElementById("scoreValue");
    const streakValue = document.getElementById("streakValue");

    const instruction = document.getElementById("instruction");
    const targetLabel = document.getElementById("targetLabel");
    const targetContent = document.getElementById("targetContent");
    const answerGrid = document.getElementById("answerGrid");
    const feedback = document.getElementById("feedback");

    const hintButton = document.getElementById("hintButton");
    const nextButton = document.getElementById("nextButton");
    const restartButton = document.getElementById("restartButton");

    const state = {
      round: 1,
      score: 0,
      streak: 0,
      targetNumber: 1,
      currentMode: "quantity-to-number",
      currentCategory: "fruit",
      currentMaterial: MATERIALS.fruit[0],
      locked: false,
      dwellTimer: null,
      activeButton: null,
      nextTimer: null
    };

    function randomInteger(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function shuffle(array) {
      const result = [...array];

      for (let index = result.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));

        [result[index], result[randomIndex]] =
          [result[randomIndex], result[index]];
      }

      return result;
    }

    function chooseMode() {
      if (modeSelect.value !== "mixed") {
        return modeSelect.value;
      }

      return Math.random() < 0.5
        ? "quantity-to-number"
        : "number-to-quantity";
    }

    function chooseCategory() {
      if (categorySelect.value !== "random") {
        return categorySelect.value;
      }

      return randomItem(["fruit", "vehicle", "food"]);
    }

    function chooseMaterial(category) {
      return randomItem(MATERIALS[category]);
    }

    function makeAnswerOptions(targetNumber, maximum) {
      const optionCount = Math.min(3, maximum);
      const values = [targetNumber];

      while (values.length < optionCount) {
        const candidate = randomInteger(maximum);

        if (!values.includes(candidate)) {
          values.push(candidate);
        }
      }

      return shuffle(values);
    }

    function createSymbolRow(quantity, material, answerSize = false) {
      const row = document.createElement("div");
      row.className = "symbol-row";
      row.setAttribute(
        "aria-label",
        `${quantity}個${material.name}`
      );

      for (let count = 0; count < quantity; count += 1) {
        const symbol = document.createElement("span");
        symbol.className = answerSize
          ? "answer-symbol"
          : "target-symbol";
        symbol.textContent = material.symbol;
        symbol.setAttribute("aria-hidden", "true");
        row.appendChild(symbol);
      }

      return row;
    }

    function updateStatistics() {
      roundValue.textContent = String(state.round);
      scoreValue.textContent = String(state.score);
      streakValue.textContent = String(state.streak);
    }

    function clearDwellSelection() {
      if (state.dwellTimer !== null) {
        window.clearTimeout(state.dwellTimer);
        state.dwellTimer = null;
      }

      if (state.activeButton !== null) {
        state.activeButton.classList.remove("is-gazing");

        const fill =
          state.activeButton.querySelector(".dwell-fill");

        if (fill) {
          fill.style.animationDuration = "";
        }

        state.activeButton = null;
      }
    }

    function startDwellSelection(button) {
      if (
        !gazeToggle.checked ||
        state.locked ||
        button.disabled
      ) {
        return;
      }

      clearDwellSelection();

      const dwellMilliseconds =
        Number(dwellSelect.value);

      state.activeButton = button;

      const fill = button.querySelector(".dwell-fill");

      if (fill) {
        fill.style.animationDuration =
          `${dwellMilliseconds}ms`;
      }

      button.classList.add("is-gazing");

      state.dwellTimer = window.setTimeout(() => {
        clearDwellSelection();
        submitAnswer(button);
      }, dwellMilliseconds);
    }

    function showNeutralFeedback(message) {
      feedback.className = "feedback";
      feedback.textContent = message;
    }

    function showCorrectFeedback(message) {
      feedback.className = "feedback correct";
      feedback.textContent = message;
    }

    function showWrongFeedback(message) {
      feedback.className = "feedback wrong";
      feedback.textContent = message;
    }

    function renderTarget() {
      targetContent.innerHTML = "";

      const categoryName =
        CATEGORY_NAMES[state.currentCategory];

      if (state.currentMode === "quantity-to-number") {
        targetLabel.textContent =
          `數一數這些${categoryName}`;

        instruction.textContent =
          "看一看有幾個，再選出正確的數字。";

        targetContent.appendChild(
          createSymbolRow(
            state.targetNumber,
            state.currentMaterial
          )
        );
      } else {
        targetLabel.textContent =
          `找出一樣多的${state.currentMaterial.name}`;

        instruction.textContent =
          "看數字，再選出一樣多的物品。";

        const number = document.createElement("div");
        number.className = "target-number";
        number.textContent = String(state.targetNumber);
        number.setAttribute(
          "aria-label",
          `數字${state.targetNumber}`
        );

        targetContent.appendChild(number);
      }
    }

    function createAnswerButton(value) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "answer-button";
      button.dataset.value = String(value);

      if (state.currentMode === "quantity-to-number") {
        button.setAttribute(
          "aria-label",
          `答案數字${value}`
        );

        const number = document.createElement("div");
        number.className = "answer-number";
        number.textContent = String(value);
        button.appendChild(number);
      } else {
        button.setAttribute(
          "aria-label",
          `${value}個${state.currentMaterial.name}`
        );

        button.appendChild(
          createSymbolRow(
            value,
            state.currentMaterial,
            true
          )
        );
      }

      const track = document.createElement("div");
      track.className = "dwell-track";
      track.setAttribute("aria-hidden", "true");

      const fill = document.createElement("div");
      fill.className = "dwell-fill";

      track.appendChild(fill);
      button.appendChild(track);

      button.addEventListener("pointerenter", () => {
        startDwellSelection(button);
      });

      button.addEventListener(
        "pointerleave",
        clearDwellSelection
      );

      button.addEventListener(
        "pointercancel",
        clearDwellSelection
      );

      button.addEventListener("focus", () => {
        if (gazeToggle.checked) {
          startDwellSelection(button);
        }
      });

      button.addEventListener(
        "blur",
        clearDwellSelection
      );

      button.addEventListener("click", () => {
        clearDwellSelection();
        submitAnswer(button);
      });

      return button;
    }

    function renderAnswers() {
      answerGrid.innerHTML = "";

      const maximum = Number(rangeSelect.value);
      const values = makeAnswerOptions(
        state.targetNumber,
        maximum
      );

      for (const value of values) {
        answerGrid.appendChild(
          createAnswerButton(value)
        );
      }
    }

    function submitAnswer(button) {
      if (state.locked || button.disabled) {
        return;
      }

      const selectedNumber =
        Number(button.dataset.value);

      if (selectedNumber === state.targetNumber) {
        state.locked = true;
        state.score += 1;
        state.streak += 1;

        button.classList.add("correct");

        showCorrectFeedback(
          `答對了！是 ${state.targetNumber} 個${state.currentMaterial.name}。`
        );

        updateStatistics();

        state.nextTimer = window.setTimeout(() => {
          state.round += 1;
          startNewRound();
        }, 1500);
      } else {
        state.streak = 0;

        button.classList.add("wrong");
        button.disabled = true;

        showWrongFeedback(
          "不一樣，再慢慢數一次。"
        );

        updateStatistics();
      }
    }

    function startNewRound() {
      clearDwellSelection();

      if (state.nextTimer !== null) {
        window.clearTimeout(state.nextTimer);
        state.nextTimer = null;
      }

      state.locked = false;
      state.targetNumber =
        randomInteger(Number(rangeSelect.value));
      state.currentMode = chooseMode();
      state.currentCategory = chooseCategory();
      state.currentMaterial =
        chooseMaterial(state.currentCategory);

      showNeutralFeedback(
        "請凝視或點選一個答案。"
      );

      updateStatistics();
      renderTarget();
      renderAnswers();
    }

    function showHint() {
      clearDwellSelection();

      if (state.currentMode === "quantity-to-number") {
        showNeutralFeedback(
          `請從左到右慢慢數：1、2……共有幾個${state.currentMaterial.name}？`
        );
      } else {
        showNeutralFeedback(
          `題目是數字 ${state.targetNumber}，請找出 ${state.targetNumber} 個${state.currentMaterial.name}。`
        );
      }
    }

    function restartGame() {
      state.round = 1;
      state.score = 0;
      state.streak = 0;
      startNewRound();
    }

    hintButton.addEventListener("click", showHint);

    nextButton.addEventListener("click", () => {
      state.round += 1;
      startNewRound();
    });

    restartButton.addEventListener(
      "click",
      restartGame
    );

    modeSelect.addEventListener(
      "change",
      restartGame
    );

    rangeSelect.addEventListener(
      "change",
      restartGame
    );

    categorySelect.addEventListener(
      "change",
      restartGame
    );

    dwellSelect.addEventListener(
      "change",
      clearDwellSelection
    );

    gazeToggle.addEventListener(
      "change",
      clearDwellSelection
    );

    restartGame();
  </script>
</body>
</html>
