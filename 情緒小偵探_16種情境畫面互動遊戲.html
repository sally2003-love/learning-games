<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情緒小偵探－16種情境互動遊戲</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f5fbff;color:#17324d}
.app{max-width:1180px;margin:auto;padding:16px}h1{margin:0 0 5px;font-size:clamp(30px,4vw,48px);font-weight:950}.sub{margin:0 0 14px;font-size:17px;line-height:1.6}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.pill{padding:10px 13px;border-radius:13px;background:#fff;border:1px solid #cfe0ed;font-weight:850}
.progress{flex:1;min-width:220px}.track{height:12px;border-radius:99px;background:#dcecf7;overflow:hidden;margin-top:6px}.fill{height:100%;width:0;background:#438bd1;transition:width .25s}
button{font:inherit}.btn{min-height:46px;border:0;border-radius:13px;padding:10px 16px;font-weight:900;cursor:pointer}.reset{background:#6e7a86;color:#fff}
.game{display:grid;grid-template-columns:minmax(390px,.95fr) minmax(480px,1.05fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid #cfdfeb;border-radius:20px;padding:16px}
.scene-title{font-size:24px;font-weight:950;margin:0 0 8px}.story{font-size:18px;line-height:1.65;margin:0 0 12px}
.scene{height:330px;border-radius:18px;position:relative;overflow:hidden;border:2px solid #d6e2e9;background:#e8f6ff}.scene .sun{position:absolute;right:20px;top:18px;font-size:44px}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:rgba(255,255,255,.22)}.scene .obj{position:absolute;font-size:70px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.12));user-select:none}
.scene .o0{left:9%;top:14%}.scene .o1{left:36%;top:44%;font-size:84px}.scene .o2{right:10%;top:17%}.scene .o3{right:18%;bottom:9%;font-size:62px}
.scene-caption{position:absolute;left:16px;right:16px;bottom:14px;background:rgba(255,255,255,.9);border-radius:12px;padding:9px 12px;font-weight:850;text-align:center}
.dropbox{margin-top:13px;border:3px dashed #69a9de;border-radius:16px;min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:900;color:#5a7b97;padding:10px}
.dropbox.over{background:#e8f5ff}.dropbox.done{border-style:solid;border-color:#55aa62;background:#ecf9ed;color:#247336}
.hintrow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.hintbtn{background:#ffd86a;color:#513f00}.hint{display:none;padding:10px 12px;background:#fff8d8;border-radius:12px;border:1px solid #ead17c;line-height:1.5}.hint.show{display:block}
.options-title{font-size:20px;font-weight:950;margin:0 0 10px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.face{border:2px solid #b9d3e6;border-radius:16px;background:#fff;padding:8px;cursor:grab;text-align:center;min-width:0;touch-action:manipulation}.face.selected{outline:4px solid #2f7fd8;outline-offset:2px}.face.used{opacity:.28;pointer-events:none}
.face img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.face .zh{font-size:19px;font-weight:950;margin-top:6px}.face .en{font-size:13px;font-weight:800;color:#637e94}
.feedback{margin-top:13px;min-height:54px;border-radius:13px;padding:11px 13px;background:#f4f8fb;border:1px solid #d8e4ec;font-weight:800;line-height:1.5}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.next{background:#2f7fd8;color:#fff}.next:disabled{opacity:.4;cursor:not-allowed}
.summary{display:none}.summary.show{display:block}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sum-card{background:#fff;border:1px solid #cfe0ed;border-radius:14px;padding:8px;text-align:center}
.sum-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.sum-card b{display:block;margin-top:5px}
@media(max-width:900px){.game{grid-template-columns:1fr}}@media(max-width:600px){.options{grid-template-columns:1fr 1fr}.scene{height:280px}.summary-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<h1>🕵️ 情緒小偵探</h1>
<p class="sub">看情境、看畫面，再把最符合的表情拖到情境框。16 種情緒都會出現一次；平板也能用「點表情 → 點情境框」。</p>
<div class="topbar">
<div class="pill progress">進度：<span id="progressText">1 / 16</span><div class="track"><div class="fill" id="fill"></div></div></div>
<div class="pill">首次答對：<span id="score">0</span></div>
<button class="btn reset" id="restart" type="button">重新開始</button>
</div>
<main id="game" class="game">
<section class="card">
<h2 id="sceneTitle" class="scene-title"></h2>
<p id="story" class="story"></p>
<div id="scene" class="scene" aria-label="情境畫面">
<div class="ground"></div><div class="sun">☀️</div>
<div class="obj o0" id="o0"></div><div class="obj o1" id="o1"></div><div class="obj o2" id="o2"></div><div class="obj o3" id="o3"></div>
<div class="scene-caption">想一想：這時候最可能是什麼感覺？</div>
</div>
<div id="dropbox" class="dropbox" role="button" tabindex="0">把正確的表情拖到這裡</div>
<div class="hintrow"><button class="btn hintbtn" id="hintBtn" type="button">💡 看提示</button><div id="hint" class="hint"></div></div>
</section>
<section class="card">
<h2 class="options-title">選一個最符合的表情</h2>
<div id="options" class="options"></div>
<div id="feedback" class="feedback" aria-live="polite">先觀察情境，再選表情。</div>
<div class="actions"><button id="next" class="btn next" type="button" disabled>下一個情境 →</button></div>
</section>
</main>
<section id="summary" class="summary card">
<h2>🎉 16 種情緒挑戰完成</h2>
<p id="finalScore"></p><div id="summaryGrid" class="summary-grid"></div>
</section>
</div>

const emotions=DATA.emotions, scenarios=DATA.scenarios;
const byEn=Object.fromEntries(emotions.map(e=>[e.en,e]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let order=[],idx=0,score=0,firstTry=true,solved=false,selected=null;
const sceneTitle=document.getElementById("sceneTitle"),story=document.getElementById("story"),scene=document.getElementById("scene"),dropbox=document.getElementById("dropbox"),options=document.getElementById("options"),feedback=document.getElementById("feedback"),next=document.getElementById("next"),hint=document.getElementById("hint"),progressText=document.getElementById("progressText"),fill=document.getElementById("fill"),scoreEl=document.getElementById("score");
function start(){order=shuffle(scenarios);idx=0;score=0;selected=null;document.getElementById("summary").classList.remove("show");document.getElementById("game").style.display="grid";load()}
function load(){
solved=false;firstTry=true;selected=null;next.disabled=true;hint.classList.remove("show");
const s=order[idx],target=byEn[s.emotion];
sceneTitle.textContent=s.title;story.textContent=s.story;scene.style.background=s.bg;s.scene.forEach((x,i)=>document.getElementById("o"+i).textContent=x);
dropbox.className="dropbox";dropbox.textContent="把正確的表情拖到這裡";hint.textContent="提示："+s.cue;feedback.textContent="先觀察情境，再選表情。";
progressText.textContent=`${idx+1} / ${order.length}`;fill.style.width=`${(idx/order.length)*100}%`;scoreEl.textContent=score;
const distractors=shuffle(emotions.filter(e=>e.en!==s.emotion)).slice(0,3);const choices=shuffle([target,...distractors]);options.innerHTML="";
choices.forEach(e=>{const b=document.createElement("button");b.type="button";b.className="face";b.draggable=true;b.dataset.en=e.en;b.innerHTML=`<img src="${e.img}" alt="${e.zh}表情"><div class="zh">${e.zh}</div><div class="en">${e.en}</div>`;
b.addEventListener("click",()=>{if(solved)return;selected=selected===e.en?null:e.en;[...options.children].forEach(x=>x.classList.toggle("selected",x.dataset.en===selected));feedback.textContent=selected?`已選取「${e.zh}」，再點左邊情境框。`:"請重新選一個表情。"});
b.addEventListener("dragstart",ev=>{if(solved){ev.preventDefault();return}ev.dataTransfer.setData("text/plain",e.en)});options.appendChild(b)});
}
function tryAnswer(en){
if(!en||solved)return;const s=order[idx],e=byEn[en],target=byEn[s.emotion];
if(en===s.emotion){solved=true;if(firstTry)score++;scoreEl.textContent=score;dropbox.classList.add("done");dropbox.innerHTML=`✅ ${target.zh} <span style="font-size:.85em;color:#60798e">(${target.en})</span>`;feedback.innerHTML=`答對了！<br><b>${s.cue}</b>`;[...options.children].forEach(x=>{if(x.dataset.en!==en)x.classList.add("used");x.classList.remove("selected")});next.disabled=false}
else{firstTry=false;feedback.textContent=`「${e.zh}」不太符合這個情境，再觀察故事和畫面一次。`}
selected=null;
}
dropbox.addEventListener("dragover",e=>{e.preventDefault();dropbox.classList.add("over")});dropbox.addEventListener("dragleave",()=>dropbox.classList.remove("over"));dropbox.addEventListener("drop",e=>{e.preventDefault();dropbox.classList.remove("over");tryAnswer(e.dataTransfer.getData("text/plain"))});dropbox.addEventListener("click",()=>tryAnswer(selected));dropbox.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&selected){e.preventDefault();tryAnswer(selected)}});
document.getElementById("hintBtn").onclick=()=>hint.classList.toggle("show");
next.onclick=()=>{idx++;if(idx>=order.length)finish();else load()};
function finish(){document.getElementById("game").style.display="none";const sum=document.getElementById("summary");sum.classList.add("show");fill.style.width="100%";progressText.textContent="16 / 16";document.getElementById("finalScore").textContent=`首次作答答對 ${score} / 16。下面是這次練習的 16 種情緒。`;const grid=document.getElementById("summaryGrid");grid.innerHTML="";emotions.forEach(e=>{const d=document.createElement("div");d.className="sum-card";d.innerHTML=`<img src="${e.img}" alt="${e.zh}"><b>${e.zh}</b><span>${e.en}</span>`;grid.appendChild(d)})}
document.getElementById("restart").onclick=start;start();
})();
</script>
</body>
</html>
