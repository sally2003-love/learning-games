<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情拼圖室 - 互動遊戲</title>
    <style>
        :root {
            --primary: #333;
            --bg-color: #f4f4f9;
            --box-bg: #fff;
            --accent: #4CAF50;
            --error: #f44336;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        .instructions {
            color: #666;
            margin-bottom: 20px;
        }

        .game-board {
            background: var(--box-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* 目標與公式區 */
        .top-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .target-face {
            width: 150px;
            height: 150px;
            border: 3px solid var(--primary);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .target-face img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .equation {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .drop-zone {
            width: 70px;
            height: 70px;
            border: 2px dashed #999;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fafafa;
            transition: all 0.2s ease;
        }

        .drop-zone.hovered {
            border-color: var(--accent);
            background-color: #e8f5e9;
            transform: scale(1.05);
        }

        /* 庫存元件區 */
        .inventory {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #eee;
            border-radius: 8px;
            min-height: 100px;
        }

        .piece {
            width: 70px;
            height: 70px;
            background-color: white;
            border: 2px solid var(--primary);
            border-radius: 8px;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            /* 圖片設定：確保圖案完整顯示並置中 */
            background-size: 80%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .piece:active {
            cursor: grabbing;
        }

        .piece.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* 按鈕區 */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #check-btn {
            background-color: var(--accent);
            color: white;
        }

        #check-btn:hover {
            background-color: #45a049;
        }

        #reset-btn {
            background-color: #ddd;
            color: #333;
        }

        #reset-btn:hover {
            background-color: #ccc;
        }

        .message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
        }
    </style>
</head>
<body>

    <h1>表情拼圖室</h1>
    <p class="instructions">發揮你的觀察力！將下方正確的五官零件拖曳到空格中，組成目標臉孔。</p>

    <div class="game-board">
        <div class="top-section">
            <div class="target-face">
                <img src="target.png" alt="目標臉孔">
            </div>
            <div class="equation">
                = 
                <div class="drop-zone" data-index="0"></div> + 
                <div class="drop-zone" data-index="1"></div> + 
                <div class="drop-zone" data-index="2"></div> + 
                <div class="drop-zone" data-index="3"></div> + 
                <div class="drop-zone" data-index="4"></div>
            </div>
        </div>

        <h3>五官零件庫</h3>
        <div class="inventory" id="inventory">
            <!-- JavaScript 會動態載入 part1.png ~ part15.png -->
        </div>

        <div class="controls">
            <button id="reset-btn">全部退回</button>
            <button id="check-btn">檢查答案</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inventory = document.getElementById('inventory');
            const dropZones = document.querySelectorAll('.drop-zone');
            const messageEl = document.getElementById('message');
            
            // ★ 已根據您的正確組合更新：這張圖片的正確答案組合為 4, 6, 7, 9, 11 ★
            const correctAnswer = ['4', '6', '7', '9', '11']; 

            // 動態載入 15 張圖片零件
            for (let i = 1; i <= 15; i++) {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.setAttribute('draggable', 'true');
                piece.setAttribute('data-id', i);
                
                piece.style.backgroundImage = `url('part${i}.png')`;
                
                inventory.appendChild(piece);
            }

            const pieces = document.querySelectorAll('.piece');
            let draggedItem = null;

            // 設定拖曳事件
            pieces.forEach(piece => {
                piece.addEventListener('dragstart', function(e) {
                    draggedItem = this;
                    setTimeout(() => this.classList.add('dragging'), 0);
                });

                piece.addEventListener('dragend', function() {
                    setTimeout(() => {
                        this.classList.remove('dragging');
                        draggedItem = null;
                    }, 0);
                });
            });

            // 設定放置區事件
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault(); 
                });

                zone.addEventListener('dragenter', function(e) {
                    e.preventDefault();
                    this.classList.add('hovered');
                });

                zone.addEventListener('dragleave', function() {
                    this.classList.remove('hovered');
                });

                zone.addEventListener('drop', function(e) {
                    this.classList.remove('hovered');
                    if (draggedItem) {
                        if (this.children.length > 0) {
                            inventory.appendChild(this.children[0]);
                        }
                        this.appendChild(draggedItem);
                    }
                });
            });

            // 允許從公式區拖回庫存區
            inventory.addEventListener('dragover', e => e.preventDefault());
            inventory.addEventListener('drop', function(e) {
                if (draggedItem) {
                    this.appendChild(draggedItem);
                }
            });

            // 點擊格子內的元件可以直接退回庫存
            dropZones.forEach(zone => {
                zone.addEventListener('click', function() {
                    if (this.children.length > 0) {
                        inventory.appendChild(this.children[0]);
                    }
                });
            });

            // 檢查答案邏輯
            document.getElementById('check-btn').addEventListener('click', () => {
                const currentAns = [];
                dropZones.forEach(zone => {
                    if (zone.children.length > 0) {
                        currentAns.push(zone.children[0].getAttribute('data-id'));
                    }
                });

                if (currentAns.length < 5) {
                    messageEl.style.color = 'var(--error)';
                    messageEl.textContent = '請填滿所有 5 個空格喔！';
                    return;
                }

                const sortedCurrent = currentAns.sort().join(',');
                const sortedCorrect = correctAnswer.sort().join(',');

                if (sortedCurrent === sortedCorrect) {
                    messageEl.style.color = 'var(--accent)';
                    messageEl.textContent = '🎉 恭喜！你找出了所有正確的五官！';
                } else {
                    messageEl.style.color = 'var(--error)';
                    messageEl.textContent = '❌ 好像哪裡不太對，再仔細觀察一下喔！';
                }
            });

            // 重置按鈕
            document.getElementById('reset-btn').addEventListener('click', () => {
                dropZones.forEach(zone => {
                    if (zone.children.length > 0) {
                        inventory.appendChild(zone.children[0]);
                    }
                });
                messageEl.textContent = '';
                
                const sortedPieces = Array.from(inventory.children).sort((a, b) => {
                    return parseInt(a.getAttribute('data-id')) - parseInt(b.getAttribute('data-id'));
                });
                inventory.innerHTML = '';
                sortedPieces.forEach(p => inventory.appendChild(p));
            });
        });
    </script>
</body>
</html>
