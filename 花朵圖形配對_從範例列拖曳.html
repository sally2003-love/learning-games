<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>花朵圖形配對－從範例拖曳</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f3f4f6;color:#111827;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
.app{width:min(920px,100%);margin:auto;padding:12px}
.info{
  background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:12px 14px;margin-bottom:10px
}
.info h1{margin:0 0 5px;font-size:clamp(21px,3vw,30px)}
.info p{margin:0;color:#6b7280;font-size:16px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-weight:800}
.board-card{background:#fff;border:1px solid #d1d5db;border-radius:16px;padding:8px}
.board{position:relative;width:100%;max-width:826px;margin:auto;user-select:none;touch-action:manipulation}
.board>img{display:block;width:100%;height:auto}
.source-shape{
  position:absolute;border:3px solid transparent;background:transparent;border-radius:10px;
  cursor:grab;touch-action:none;padding:0;z-index:4
}
.source-shape:hover,.source-shape.selected{
  border-color:#2563eb;background:rgba(37,99,235,.06)
}
.source-shape:active{cursor:grabbing}
.source-shape:focus-visible{outline:4px solid #2563eb;outline-offset:2px}
.drop{
  position:absolute;border:2px dashed transparent;background:transparent;border-radius:7px;
  display:flex;align-items:center;justify-content:center;padding:0
}
.drop.active{border-color:#2563eb;background:rgba(37,99,235,.07)}
.drop.done{background:rgba(22,163,74,.05)}
.placed{width:56%;height:56%;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#0b2635}
.placed svg{width:100%;height:100%;display:block}
.feedback{
  margin-top:10px;min-height:48px;padding:10px 14px;border-radius:12px;background:#f3f4f6;
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800
}
.feedback.good{background:#ecfdf3;color:#166534}
.feedback.bad{background:#fef2f2;color:#991b1b}
.actions{display:flex;justify-content:center;margin-top:10px}
.reset{
  min-height:44px;padding:0 18px;border:1px solid #d1d5db;background:#fff;border-radius:11px;
  font-size:16px;font-weight:800;cursor:pointer
}
.drag-ghost{
  position:fixed;z-index:9999;width:68px;height:68px;display:flex;align-items:center;justify-content:center;
  pointer-events:none;background:#fff;border:3px solid #2563eb;border-radius:12px;
  transform:translate(-50%,-50%);box-shadow:0 8px 24px rgba(0,0,0,.18);color:#0b2635
}
.drag-ghost svg{width:52px;height:52px}
@media(max-width:600px){
  .app{padding:6px}
  .info p{font-size:14px}
  .feedback{font-size:16px}
}
</style>
</head>
<body>
<main class="app">
  <section class="info">
    <h1>花朵圖形配對</h1>
    <p>直接從最上方範例中的 ○、△、□ 拖曳到下面正確的空格。平板也可以先點上方形狀，再點空格。</p>

      <span>完成：<span id="doneCount">0</span> / 45</span>
      <span>答錯：<span id="wrongCount">0</span> 次</span>
    </div>
  </section>

<script>
(() => {
  const SVG={
    circle:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="8"/></svg>',
    triangle:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 14 L88 82 H12 Z" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/></svg>',
    square:'<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="18" y="18" width="64" height="64" fill="none" stroke="currentColor" stroke-width="8"/></svg>'
  };
  const label={circle:"圓形",triangle:"三角形",square:"正方形"};

  const board=document.getElementById("board");
  const sources=[...document.querySelectorAll(".source-shape")];
  const drops=[...document.querySelectorAll(".drop")];
  const feedback=document.getElementById("feedback");
  const doneCount=document.getElementById("doneCount");
  const wrongCount=document.getElementById("wrongCount");

  let selected=null, dragging=null, ghost=null, done=0, wrong=0;

  function setSelected(shape){
    selected=shape;
    sources.forEach(s=>s.classList.toggle("selected",s.dataset.shape===shape));
    feedback.className="feedback";
    feedback.textContent=`已選擇「${label[shape]}」，請拖到或點選正確空格。`;
  }

  function place(drop,shape){
    if(!drop || drop.dataset.done==="1") return;
    if(shape===drop.dataset.answer){
      drop.dataset.done="1";
      drop.classList.add("done");
      drop.innerHTML=`<span class="placed">${SVG[shape]}</span>`;
      done++;
      doneCount.textContent=done;
      feedback.className="feedback good";
      feedback.textContent=`答對了！`;
      if(done===drops.length){
        feedback.textContent=`🎉 全部完成！共答錯 ${wrong} 次。`;
      }
    }else{
      wrong++;
      wrongCount.textContent=wrong;
      feedback.className="feedback bad";
      feedback.textContent=`再看看，這個位置不是「${label[shape]}」。`;
      drop.animate(
        [{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],
        {duration:220}
      );
    }
  }

  function startDrag(shape,e){
    dragging=shape;
    setSelected(shape);
    ghost=document.createElement("div");
    ghost.className="drag-ghost";
    ghost.innerHTML=SVG[shape];
    document.body.appendChild(ghost);
    ghost.style.left=e.clientX+"px";
    ghost.style.top=e.clientY+"px";
  }

  function moveDrag(e){
    if(!dragging||!ghost)return;
    ghost.style.left=e.clientX+"px";
    ghost.style.top=e.clientY+"px";
    drops.forEach(d=>d.classList.remove("active"));
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const d=el?.closest?.(".drop");
    if(d&&d.dataset.done!=="1") d.classList.add("active");
  }

  function endDrag(e){
    if(!dragging)return;
    drops.forEach(d=>d.classList.remove("active"));
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const d=el?.closest?.(".drop");
    if(d) place(d,dragging);
    ghost?.remove();
    ghost=null;
    dragging=null;
  }

  sources.forEach(s=>{
    s.addEventListener("click",()=>setSelected(s.dataset.shape));
    s.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse"&&e.button!==0)return;
      s.setPointerCapture?.(e.pointerId);
      startDrag(s.dataset.shape,e);
      e.preventDefault();
    });
    s.addEventListener("pointermove",moveDrag);
    s.addEventListener("pointerup",endDrag);
    s.addEventListener("pointercancel",()=>{
      drops.forEach(d=>d.classList.remove("active"));
      ghost?.remove();ghost=null;dragging=null;
    });
  });

  drops.forEach(d=>{
    d.addEventListener("click",()=>{
      if(selected) place(d,selected);
      else{
        feedback.className="feedback";
        feedback.textContent="請先點選上方範例中的圓形、三角形或正方形。";
      }
    });
  });

  document.getElementById("resetBtn").addEventListener("click",()=>{
    selected=null;dragging=null;done=0;wrong=0;
    doneCount.textContent="0";wrongCount.textContent="0";
    sources.forEach(s=>s.classList.remove("selected"));
    drops.forEach(d=>{d.dataset.done="0";d.classList.remove("done","active");d.innerHTML="";});
    ghost?.remove();ghost=null;
    feedback.className="feedback";
    feedback.textContent="請直接拖曳上方範例中的 ○、△ 或 □。";
  });
})();
</script>
</body>
</html>
