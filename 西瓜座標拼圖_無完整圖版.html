<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>西瓜座標拼圖</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
  background:#faf7ef;
  color:#111;
}
.app{
  max-width:1500px;
  margin:auto;
  padding:18px;
}
.title{font-size:clamp(28px,3vw,46px);font-weight:900;margin:0 0 4px}
.desc{font-size:18px;margin:0 0 14px}
.layout{
  display:grid;
  grid-template-columns:minmax(620px,1.05fr) minmax(560px,.95fr);
  gap:18px;
  align-items:start;
}
.panel{
  background:#fffdf8;
  border:1px solid #ddd4c5;
  border-radius:18px;
  padding:14px;
}
.left-stack{display:grid;gap:14px}
.board{
  display:grid;
  grid-template-columns:52px repeat(6,minmax(78px,1fr));
  grid-template-rows:44px repeat(4,minmax(78px,1fr));
  gap:4px;
}
.head{
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:800;
}
.cell{
  border:2px solid #333;
  border-radius:12px;
  background:#fff;
  aspect-ratio:1/1;
  overflow:hidden;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  min-width:0;
}
.cell.dragover{outline:4px solid #3f8f49;outline-offset:-4px}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.ok{
  position:absolute;right:5px;top:5px;
  width:27px;height:27px;border-radius:50%;
  background:#2e8b3c;color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.reference h2,.bank h2{font-size:22px;margin:0 0 10px}
.refgrid{
  display:grid;
  grid-template-columns:42px repeat(6,minmax(62px,1fr));
  grid-template-rows:34px repeat(4,minmax(62px,1fr));
  gap:0;
  max-width:650px;
}
.refhead{
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;
}
.refcell{border:1px solid #333;aspect-ratio:1/1;overflow:hidden;background:#fff}
.refcell img{width:100%;height:100%;object-fit:cover;display:block}
.tiles{
  display:grid;
  grid-template-columns:repeat(6,minmax(74px,1fr));
  gap:10px;
}
.tile{
  border:2px solid #333;
  border-radius:10px;
  background:#fff;
  overflow:hidden;
  padding:0;
  cursor:grab;
  min-width:0;
}
.tile.selected{outline:4px solid #2f78c8;outline-offset:2px}
.code{
  color:#000;
  background:#fff4cf;
  font-size:20px;
  font-weight:900;
  text-align:center;
  padding:7px 2px;
}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.controls{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:14px
}
button.action{
  border:0;border-radius:12px;padding:11px 18px;
  min-height:46px;font-size:17px;font-weight:800;
  color:#fff;cursor:pointer
}
.shuffle{background:#2b7fe8}
.check{background:#28a35f}
.clear{background:#ef4747}
.status{
  margin-top:10px;padding:10px 12px;border-radius:10px;
  background:#fff;border:1px solid #ddd4c5;font-weight:700
}
.hint{font-size:14px;color:#555;margin-top:10px}
@media(max-width:1120px){
  .layout{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(6,minmax(70px,1fr))}
}
@media(max-width:700px){
  .app{padding:10px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .board{min-width:620px}
  .panel.board-panel{overflow:auto}
  .refgrid{min-width:520px}
  .reference{overflow:auto}
}
</style>
</head>
<body>
<div class="app">
  <h1 class="title">🍉 西瓜座標拼圖</h1>
  <p class="desc">請依每張圖片上方的座標提示，把右側西瓜碎片拖曳到左方正確的格子中。</p>

  <div class="layout">
    <div class="left-stack">
      <section class="panel board-panel">
        <div id="board" class="board"></div>
      </section>
    </div>

    <section class="panel bank">
      <h2>西瓜碎片（拖曳到左側格子）</h2>
      <div id="tiles" class="tiles"></div>

      <div class="controls">
        <button class="action shuffle" id="shuffleBtn" type="button">↻ 重新洗牌</button>
        <button class="action check" id="checkBtn" type="button">✓ 檢查答案</button>
        <button class="action clear" id="clearBtn" type="button">🗑 清空格子</button>
      </div>
      <div id="status" class="status" aria-live="polite">已完成 0 / 24</div>
      <div class="hint">拖曳操作不方便時，也可以「點圖片 → 點左側格子」。放錯位置會自動退回。</div>
    </section>
  </div>
</div>

  const rows=["A","B","C","D"], cols=["1","2","3","4","5","6"];
  const board=document.getElementById("board");
  const tilesBox=document.getElementById("tiles");
  const status=document.getElementById("status");
  const shuffleBtn=document.getElementById("shuffleBtn");
  const checkBtn=document.getElementById("checkBtn");
  const clearBtn=document.getElementById("clearBtn");

  let tiles=rootTiles.map(x=>({...x}));
  let placed=new Set();
  let selected=null;
  let dragging=null;

  function makeHead(text, cls="head"){
    const d=document.createElement("div"); d.className=cls; d.textContent=text; return d;
  }

  function buildBoard(){
    board.innerHTML="";
    board.appendChild(document.createElement("div"));
    cols.forEach(c=>board.appendChild(makeHead(c)));
    rows.forEach(r=>{
      board.appendChild(makeHead(r));
      cols.forEach(c=>{
        const code=r+c;
        const cell=document.createElement("button");
        cell.type="button";
        cell.className="cell";
        cell.dataset.code=code;
        cell.setAttribute("aria-label","座標 "+code);
        cell.addEventListener("click",()=>{ if(selected) place(selected,code); });
        cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("dragover")});
        cell.addEventListener("dragleave",()=>cell.classList.remove("dragover"));
        cell.addEventListener("drop",e=>{
          e.preventDefault(); cell.classList.remove("dragover");
          const codeFromData=e.dataTransfer.getData("text/plain")||dragging;
          if(codeFromData) place(codeFromData,code);
        });
        board.appendChild(cell);
      });
    });
  }


  function renderTiles(){
    tilesBox.innerHTML="";
    tiles.filter(t=>!placed.has(t.code)).forEach(t=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="tile"+(selected===t.code?" selected":"");
      b.draggable=true;
      b.innerHTML=`<div class="code">${t.code}</div><img src="${t.img}" alt="西瓜碎片 ${t.code}">`;
      b.addEventListener("click",()=>{
        selected = selected===t.code ? null : t.code;
        renderTiles();
        status.textContent=selected?`已選取 ${selected}，請點左側格子。`:progress();
      });
      b.addEventListener("dragstart",e=>{
        dragging=t.code;
        e.dataTransfer.setData("text/plain",t.code);
        e.dataTransfer.effectAllowed="move";
      });
      b.addEventListener("dragend",()=>dragging=null);
      tilesBox.appendChild(b);
    });
  }

  function place(tileCode,targetCode){
    if(tileCode!==targetCode){
      status.textContent=`❌ ${tileCode} 不是 ${targetCode}，再試一次。`;
      selected=null; renderTiles(); return;
    }
    if(placed.has(tileCode)) return;
    const t=tiles.find(x=>x.code===tileCode);
    const cell=board.querySelector(`.cell[data-code="${targetCode}"]`);
    cell.innerHTML=`<img src="${t.img}" alt="已完成 ${tileCode}"><span class="ok">✓</span>`;
    cell.disabled=true;
    placed.add(tileCode);
    selected=null;
    renderTiles();
    status.textContent=placed.size===24?"🎉 全部完成！24 / 24":"✅ "+progress();
  }

  function progress(){return `已完成 ${placed.size} / 24`}

  function shuffle(){
    for(let i=tiles.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [tiles[i],tiles[j]]=[tiles[j],tiles[i]];
    }
    renderTiles();
    status.textContent="已重新洗牌。"+progress();
  }

  function clearAll(){
    placed.clear(); selected=null; dragging=null;
    buildBoard(); renderTiles();
    status.textContent=progress();
  }

  shuffleBtn.addEventListener("click",shuffle);
  clearBtn.addEventListener("click",clearAll);
  checkBtn.addEventListener("click",()=>{
    if(placed.size===24) status.textContent="🎉 全部正確！24 / 24";
    else status.textContent=`目前已正確完成 ${placed.size} 格，還有 ${24-placed.size} 格。`;
  });

  buildBoard();
  shuffle();
})();
</script>
