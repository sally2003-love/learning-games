<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表情拼圖室 - 自由拼貼版</title>
    <style>
        :root {
            --primary: #333;
            --bg-color: #f0f2f5;
            --box-bg: #fff;
            --accent: #ff9800;
            --success: #4CAF50;
            --error: #f44336;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            touch-action: pan-y;
        }

        .game-container {
            background: var(--box-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .header-text {
            margin-bottom: 25px;
        }

        .tips {
            background-color: #fff4e6;
            color: #e65100;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .stage-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .face-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .face-box h3 {
            margin: 0;
            color: #555;
        }

        .target-face, .canvas-area {
            width: 250px;
            height: 250px;
            background-color: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .target-face {
            border: 4px solid #ccc;
        }

        .canvas-area {
            border: 4px dashed var(--accent);
            background-color: #fffdfa;
        }

        .target-face img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .canvas-area img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            mix-blend-mode: multiply;
            cursor: move;
            user-select: none;
            -webkit-user-drag: none;
        }

        .canvas-area img.dragging {
            opacity: 0.7;
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            border-radius: 10px;
        }

        .vs-text {
            font-size: 28px;
            font-weight: bold;
            color: #ccc;
        }

        .inventory {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border: 2px solid #eee;
            min-height: 120px;
        }

        .piece {
            width: 75px;
            height: 75px;
            background-color: white;
            border: 3px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: all 0.2s;
            background-size: 70%;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }

        .piece:hover {
            transform: translateY(-3px);
            border-color: #bbb;
        }

        .piece.selected {
            border-color: var(--accent);
            background-color: #fff4e6;
            transform: scale(0.95);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
            opacity: 0.6;
        }

        .piece.selected::after {
            content: '✔';
            position: absolute;
            top: 5px;
            right: 5px;
            color: var(--accent);
            font-weight: bold;
            font-size: 14px;
        }

        .status-bar {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #check-btn {
            background-color: var(--success);
            color: white;
        }

        #check-btn:hover {
            background-color: #45a049;
        }

        #reset-btn {
            background-color: #ddd;
            color: #333;
        }

        #reset-btn:hover {
            background-color: #ccc;
        }

        .message {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header-text">
            <h1>🎨 表情拼圖室 - 自由拼貼版</h1>
            <p>點擊下方零件加入畫布，直接拖曳調整位置。</p>
            <div class="tips">💡 游標指著畫布上的圖案，滑動滑鼠滾輪即可放大或縮小！</div>
        </div>

        <div class="stage-area">
            <div class="face-box">
                <h3>目標臉孔</h3>
                <div class="target-face">
                    <img src="target.png" alt="目標臉孔">
                </div>
            </div>
            
            <div class="vs-text">➔</div>

            <div class="face-box">
                <h3>你的畫布</h3>
                <div class="canvas-area" id="canvas-area">
                    <!-- 動態疊加圖片 -->
                </div>
            </div>
        </div>

        <div class="status-bar">
            已選擇零件：<span id="select-count">0</span> / 5
        </div>

        <div class="inventory" id="inventory">
            <!-- 動態載入 15 個零件 -->
        </div>

        <div class="controls">
            <button id="reset-btn">清空畫布</button>
            <button id="check-btn">檢查答案</button>
        </div>
        <div class="message" id="message"></div>
    </div>

    <!-- 勝利拍手音效元素 -->
    <audio id="win-sound" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inventory = document.getElementById('inventory');
            const canvasArea = document.getElementById('canvas-area');
            const messageEl = document.getElementById('message');
            const countEl = document.getElementById('select-count');
            const winSound = document.getElementById('win-sound');
            
            // ★ 正確答案設定為 3, 4, 6, 11, 14 ★
            const correctAnswer = ['3', '4', '6', '11', '14']; 
            
            // 定義哪些編號是底圖 (會自動放大)
            const baseFaces = ['7', '10', '11', '14', '15']; 

            let selectedParts = [];

            // 1. 初始化 15 個零件按鈕
            for (let i = 1; i <= 15; i++) {
                const piece = document.createElement('div');
                piece.classList.add('piece');
                piece.setAttribute('data-id', i);
                piece.style.backgroundImage = `url('part${i}.png')`;
                
                piece.addEventListener('click', () => {
                    const id = i.toString();
                    messageEl.textContent = ''; 

                    if (selectedParts.includes(id)) {
                        selectedParts = selectedParts.filter(part => part !== id);
                        piece.classList.remove('selected');
                        removeImageFromCanvas(id);
                    } else {
                        if (selectedParts.length >= 5) {
                            messageEl.style.color = 'var(--error)';
                            messageEl.textContent = '⚠️ 最多只能選擇 5 個五官喔！';
                            return;
                        }
                        selectedParts.push(id);
                        piece.classList.add('selected');
                        addImageToCanvas(id);
                    }
                    countEl.textContent = selectedParts.length;
                });

                inventory.appendChild(piece);
            }

            // 2. 將圖片加到畫布
            function addImageToCanvas(id) {
                const img = document.createElement('img');
                img.src = `part${id}.png`;
                img.setAttribute('data-canvas-id', id);
                
                if (baseFaces.includes(id)) {
                    img.style.width = '85%';
                    img.style.zIndex = '1';
                } else {
                    img.style.width = '18%'; 
                    img.style.zIndex = '10';
                    const randomOffset = (Math.random() * 20 - 10);
                    img.style.marginTop = `${randomOffset}px`;
                }

                makeDraggableAndScalable(img);
                canvasArea.appendChild(img);
            }

            function removeImageFromCanvas(id) {
                const img = canvasArea.querySelector(`img[data-canvas-id="${id}"]`);
                if (img) img.remove();
            }

            // 3. 拖曳與滾輪縮放核心邏輯
            function makeDraggableAndScalable(element) {
                let isDragging = false;
                let offsetX, offsetY;

                element.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', endDrag);

                function startDrag(e) {
                    isDragging = true;
                    element.classList.add('dragging');
                    const rect = element.getBoundingClientRect();
                    offsetX = e.clientX - (rect.left + rect.width / 2);
                    offsetY = e.clientY - (rect.top + rect.height / 2);
                }

                function drag(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const canvasRect = canvasArea.getBoundingClientRect();
                    let newLeft = e.clientX - canvasRect.left - offsetX;
                    let newTop = e.clientY - canvasRect.top - offsetY;
                    element.style.left = `${newLeft}px`;
                    element.style.top = `${newTop}px`;
                }

                function endDrag() {
                    if (!isDragging) return;
                    isDragging = false;
                    element.classList.remove('dragging');
                }

                element.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    let currentWidth = parseFloat(this.style.width);
                    
                    if (e.deltaY < 0) {
                        currentWidth += 4;
                    } else {
                        currentWidth -= 4;
                    }
                    
                    if (currentWidth < 5) currentWidth = 5;
                    if (currentWidth > 150) currentWidth = 150;
                    
                    this.style.width = `${currentWidth}%`;
                });
            }

            // 4. 檢查答案與音效觸發
            document.getElementById('check-btn').addEventListener('click', () => {
                if (selectedParts.length < 5) {
                    messageEl.style.color = 'var(--error)';
                    messageEl.textContent = `⚠️ 還差 ${5 - selectedParts.length} 個喔！`;
                    return;
                }
                const sortedCurrent = [...selectedParts].sort().join(',');
                const sortedCorrect = [...correctAnswer].sort().join(',');

                if (sortedCurrent === sortedCorrect) {
                    messageEl.style.color = 'var(--success)';
                    messageEl.textContent = '🎉 太神啦！完美過關！';
                    
                    // 播放勝利拍手音效
                    winSound.currentTime = 0;
                    winSound.play().catch(e => console.log("音效播放需要點擊互動"));
                } else {
                    messageEl.style.color = 'var(--error)';
                    messageEl.textContent = '❌ 造型很前衛，但零件選錯囉！再觀察一下！';
                }
            });

            // 5. 清空按鈕
            document.getElementById('reset-btn').addEventListener('click', () => {
                selectedParts = [];
                canvasArea.innerHTML = '';
                countEl.textContent = '0';
                messageEl.textContent = '';
                document.querySelectorAll('.piece').forEach(piece => {
                    piece.classList.remove('selected');
                });
            });
        });
    </script>
</body>
</html>
