<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法迷宮大冒險</title>
    <style>
        :root {
            --primary-color: #88d49e; /* 粉綠色 */
            --bg-color: #f0f8ff; /* 淺藍背景 */
            --cell-bg: #ffffff;
            --cell-border: #cbe6f7;
            --text-color: #333333;
            --wrong-color: #ff8a8a; /* 柔和的紅色 */
            --player-color: #ffeb3b; /* 玩家當前位置亮黃色 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #4a90e2;
            margin-bottom: 10px;
        }

        .control-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            align-items: center;
        }

        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        #maze-container {
            display: grid;
            gap: 8px;
            background-color: #e1f0fa;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .cell {
            width: 80px;
            height: 80px;
            background-color: var(--cell-bg);
            border: 2px solid var(--cell-border);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .cell:hover {
            transform: scale(1.05);
            border-color: #4a90e2;
        }

        /* 遊戲狀態樣式 */
        .cell.start {
            background-color: #ffe066;
            color: #d48806;
        }

        .cell.end {
            background-color: #ffd700;
            color: #d48806;
        }

        .cell.current {
            border: 4px solid #ff9800;
            background-color: var(--player-color);
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
            transform: scale(1.05);
        }

        .cell.correct-path {
            background-color: var(--primary-color);
            color: white;
            border-color: #6bb980;
        }

        .cell.wrong-path {
            background-color: var(--wrong-color);
            color: white;
            border-color: #e66a6a;
            animation: shake 0.4s ease-in-out;
        }

        /* 震動動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px) rotate(-3deg); }
            40%, 80% { transform: translateX(5px) rotate(3deg); }
        }

        /* 過關彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal h2 {
            color: #4a90e2;
            margin-top: 0;
            font-size: 2rem;
        }

        .modal p {
            font-size: 1.2rem;
            margin: 10px 0;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <h1>✨ 九九乘法迷宮大冒險 ✨</h1>
    
    <div class="control-panel">
        <div>⏱️ 時間: <span id="time-display">0</span> 秒</div>
        <div>💔 錯誤次數: <span id="error-display">0</span></div>
        <button class="btn" onclick="initGame()">重新產生迷宮</button>
    </div>

    <div id="maze-container"></div>

    <!-- 過關彈窗 -->
    <div class="modal-overlay" id="win-modal">
        <div class="modal">
            <h2>🎉 恭喜過關！ 🎉</h2>
            <p>你成功走到終點了！</p>
            <p>花費時間：<strong id="final-time">0</strong> 秒</p>
            <p>錯誤次數：<strong id="final-errors">0</strong> 次</p>
            <button class="btn" style="margin-top: 20px;" onclick="closeModalAndRestart()">再玩一次</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 6; // 6x6 網格
        let maze = [];
        let playerPos = { r: 0, c: 0 };
        let errorCount = 0;
        let timeCount = 0;
        let timerInterval = null;
        let isGameActive = false;

        const container = document.getElementById('maze-container');
        container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;

        // 產生隨機九九乘法
        function generateEquation(isCorrect) {
            const a = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
            const b = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
            let ans = a * b;

            if (!isCorrect) {
                // 產生隨機錯誤答案 (加減 1~5)
                const offset = Math.floor(Math.random() * 5) + 1;
                ans = Math.random() > 0.5 ? ans + offset : ans - offset;
                if (ans <= 0) ans = 1; // 避免出現負數或 0
                
                // 確保錯誤答案真的不等於正確答案
                if (ans === a * b) ans += 1;
            }
            return { text: `${a} × ${b}<br>= ${ans}`, isCorrect };
        }

        // 初始化遊戲
        function initGame() {
            // 重置狀態
            clearInterval(timerInterval);
            errorCount = 0;
            timeCount = 0;
            playerPos = { r: 0, c: 0 };
            isGameActive = true;
            
            document.getElementById('error-display').innerText = errorCount;
            document.getElementById('time-display').innerText = timeCount;
            
            generateMaze();
            renderMaze();

            // 開始計時
            timerInterval = setInterval(() => {
                timeCount++;
                document.getElementById('time-display').innerText = timeCount;
            }, 1000);
        }

        // 產生迷宮路徑演算法 (確保有一條絕對可以通關的路徑)
        function generateMaze() {
            maze = Array.from({ length: GRID_SIZE }, () => 
                Array.from({ length: GRID_SIZE }, () => ({ isPath: false, equation: null }))
            );

            // 1. 產生主要正確路徑 (從左上到右下)
            let currR = 0;
            let currC = 0;
            maze[currR][currC].isPath = true;

            while (currR < GRID_SIZE - 1 || currC < GRID_SIZE - 1) {
                // 隨機決定往下或往右走
                const canMoveRight = currC < GRID_SIZE - 1;
                const canMoveDown = currR < GRID_SIZE - 1;

                if (canMoveRight && canMoveDown) {
                    Math.random() > 0.5 ? currC++ : currR++;
                } else if (canMoveRight) {
                    currC++;
                } else if (canMoveDown) {
                    currR++;
                }
                maze[currR][currC].isPath = true;
            }

            // 2. 填入數學題目
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    // 起點與終點不放題目
                    if ((r === 0 && c === 0) || (r === GRID_SIZE - 1 && c === GRID_SIZE - 1)) {
                        continue;
                    }
                    // 根據是否為正確路徑產生對應的題目
                    maze[r][c].equation = generateEquation(maze[r][c].isPath);
                }
            }
        }

        // 渲染迷宮到畫面上
        function renderMaze() {
            container.innerHTML = '';
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');
                    cellDiv.dataset.r = r;
                    cellDiv.dataset.c = c;

                    // 處理起點與終點的文字
                    if (r === 0 && c === 0) {
                        cellDiv.innerHTML = '起點<br>🏃';
                        cellDiv.classList.add('start');
                    } else if (r === GRID_SIZE - 1 && c === GRID_SIZE - 1) {
                        cellDiv.innerHTML = '終點<br>🏁';
                        cellDiv.classList.add('end');
                    } else {
                        cellDiv.innerHTML = maze[r][c].equation.text;
                    }

                    // 綁定點擊事件
                    cellDiv.addEventListener('click', () => handleCellClick(r, c, cellDiv));
                    container.appendChild(cellDiv);
                }
            }
            updatePlayerPosition();
        }

        // 點擊判定邏輯
        function handleCellClick(r, c, cellElement) {
            if (!isGameActive) return;

            // 檢查是否為相鄰格子 (上下左右)
            const rDiff = Math.abs(playerPos.r - r);
            const cDiff = Math.abs(playerPos.c - c);
            const isAdjacent = (rDiff === 1 && cDiff === 0) || (rDiff === 0 && cDiff === 1);

            // 不能點擊自己，也不能斜角或跳躍點擊
            if (!isAdjacent) return;

            // 抵達終點
            if (r === GRID_SIZE - 1 && c === GRID_SIZE - 1) {
                playerPos = { r, c };
                updatePlayerPosition();
                triggerWin();
                return;
            }

            // 檢查題目是否正確
            if (maze[r][c].isPath) {
                // 答對了！移動玩家
                cellElement.classList.add('correct-path');
                playerPos = { r, c };
                updatePlayerPosition();
            } else {
                // 答錯了！
                cellElement.classList.remove('wrong-path'); // 移除重置動畫
                void cellElement.offsetWidth; // 觸發 reflow 讓動畫可以重複播放
                cellElement.classList.add('wrong-path');
                
                errorCount++;
                document.getElementById('error-display').innerText = errorCount;
            }
        }

        // 更新玩家所在位置的 UI
        function updatePlayerPosition() {
            // 移除舊的 current 標記
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.remove('current'));

            // 加上新的 current 標記
            const index = playerPos.r * GRID_SIZE + playerPos.c;
            cells[index].classList.add('current');
        }

        // 遊戲過關
        function triggerWin() {
            isGameActive = false;
            clearInterval(timerInterval);
            
            document.getElementById('final-time').innerText = timeCount;
            document.getElementById('final-errors').innerText = errorCount;
            document.getElementById('win-modal').style.display = 'flex';
        }

        // 關閉彈窗並重新開始
        function closeModalAndRestart() {
            document.getElementById('win-modal').style.display = 'none';
            initGame();
        }

        // 網頁載入時自動開始遊戲
        window.onload = initGame;
    </script>
</body>
</html>
