<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>先數數量，再找數字｜眼控互動遊戲</title>
  <style>
    :root {
      --bg: #f6f6f1;
      --panel: #ffffff;
      --text: #222222;
      --muted: #666666;
      --border: #b9b9b9;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --correct: #16834a;
      --correct-soft: #eaf8ef;
      --wrong: #c53a3a;
      --wrong-soft: #fff0f0;
      --focus: #ffb000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 6px solid var(--focus);
      outline-offset: 4px;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 86px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      text-align: center;
    }

    .stat-label {
      color: var(--muted);
      font-size: 18px;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 34px;
      font-weight: 800;
    }

    .settings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 14px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting label {
      font-size: 18px;
      font-weight: 700;
    }

    .setting select {
      width: 100%;
      min-height: 54px;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      color: var(--text);
      font-size: 18px;
    }

    .switch-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      font-size: 19px;
      font-weight: 700;
    }

    .switch-row input {
      width: 30px;
      height: 30px;
    }

    .stage-banner {
      margin: 16px 0;
      padding: 14px;
      border: 3px solid var(--accent);
      border-radius: 18px;
      background: var(--accent-soft);
      text-align: center;
      font-size: clamp(23px, 3vw, 34px);
      font-weight: 800;
    }

    .task-panel {
      min-height: 310px;
      padding: 22px;
      border: 3px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .task-label {
      margin-bottom: 18px;
      text-align: center;
      font-size: clamp(22px, 2.7vw, 32px);
      font-weight: 800;
    }

    .symbol-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 2vw, 24px);
      max-width: 900px;
    }

    .target-symbol {
      font-size: clamp(72px, 12vw, 120px);
      line-height: 1.05;
    }

    .stage-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .large-action,
    .number-button {
      position: relative;
      overflow: hidden;
      border: 4px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }

    .large-action {
      min-height: 96px;
      padding: 16px;
      font-size: clamp(22px, 3vw, 31px);
      font-weight: 800;
    }

    .large-action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .large-action:hover,
    .large-action.is-gazing,
    .number-button:hover,
    .number-button.is-gazing {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }

    .large-action.primary:hover,
    .large-action.primary.is-gazing {
      color: var(--text);
    }

    .number-search {
      display: none;
      margin-top: 16px;
    }

    .number-search.visible {
      display: block;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .number-button {
      min-height: 190px;
      padding: 14px;
      font-size: clamp(76px, 12vw, 130px);
      line-height: 1;
      font-weight: 900;
    }

    .number-button.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
    }

    .number-button.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
    }

    .dwell-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 18px;
      background: #dce6f8;
      pointer-events: none;
    }

    .dwell-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      pointer-events: none;
    }

    .is-gazing .dwell-fill {
      animation-name: dwellProgress;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes dwellProgress {
      from { width: 0%; }
      to { width: 100%; }
    }

    .feedback {
      min-height: 82px;
      margin-top: 16px;
      padding: 14px;
      border: 3px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(22px, 3vw, 33px);
      font-weight: 800;
    }

    .feedback.correct {
      border-color: var(--correct);
      background: var(--correct-soft);
    }

    .feedback.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 16px;
    }

    .helper {
      margin: 14px 0 4px;
      color: var(--muted);
      text-align: center;
      font-size: 17px;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      .settings {
        grid-template-columns: 1fr 1fr;
      }

      .number-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 560px) {
      .app {
        padding: 10px;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .stage-actions,
      .bottom-actions {
        grid-template-columns: 1fr;
      }

      .number-grid {
        grid-template-columns: 1fr;
      }

      .number-button {
        min-height: 150px;
      }

      .stat-label {
        font-size: 15px;
      }

      .stat-value {
        font-size: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .large-action,
      .number-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="stats" aria-label="遊戲紀錄">
      <div class="stat">
        <div class="stat-label">第幾題</div>
        <div id="roundValue" class="stat-value">1</div>
      </div>

      <div class="stat">
        <div class="stat-label">答對</div>
        <div id="scoreValue" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">連續答對</div>
        <div id="streakValue" class="stat-value">0</div>
      </div>
    </section>

    <section class="settings" aria-label="遊戲設定">
      <div class="setting">
        <label for="rangeSelect">數量範圍</label>
        <select id="rangeSelect">
          <option value="2">1～2</option>
          <option value="3">1～3</option>
          <option value="4">1～4</option>
          <option value="5" selected>1～5</option>
        </select>
      </div>

      <div class="setting">
        <label for="categorySelect">素材類別</label>
        <select id="categorySelect">
          <option value="random" selected>三類隨機</option>
          <option value="fruit">水果</option>
          <option value="vehicle">交通工具</option>
          <option value="food">食物</option>
        </select>
      </div>

      <div class="setting">
        <label for="dwellSelect">凝視時間</label>
        <select id="dwellSelect">
          <option value="800">0.8 秒</option>
          <option value="1200">1.2 秒</option>
          <option value="1600" selected>1.6 秒</option>
          <option value="2000">2 秒</option>
          <option value="2500">2.5 秒</option>
        </select>
      </div>

      <label class="switch-row" for="gazeToggle">
        <input id="gazeToggle" type="checkbox" checked />
        開啟眼控凝視選擇
      </label>
    </section>

    <div id="stageBanner" class="stage-banner">
      第一步：慢慢數一數
    </div>

    <section class="task-panel" aria-labelledby="taskLabel">
      <div id="taskLabel" class="task-label">
        這裡有幾個？
      </div>
      <div id="targetContent"></div>
    </section>

    <section id="countStage" class="stage-actions" aria-label="點數階段">
      <button id="countAgainButton" class="large-action" type="button">
        再數一次
        <span class="dwell-track" aria-hidden="true">
          <span class="dwell-fill"></span>
        </span>
      </button>

      <button id="findNumberButton" class="large-action primary" type="button">
        我數好了，找數字
        <span class="dwell-track" aria-hidden="true">
          <span class="dwell-fill"></span>
        </span>
      </button>
    </section>

    <section id="numberSearch" class="number-search" aria-label="找數字階段">
      <div id="numberGrid" class="number-grid"></div>
    </section>

    <div
      id="feedback"
      class="feedback"
      role="status"
      aria-live="assertive"
    >
      請先慢慢數一數。
    </div>

    <section class="bottom-actions">
      <button id="backToCountButton" class="large-action" type="button">
        回去再數
        <span class="dwell-track" aria-hidden="true">
          <span class="dwell-fill"></span>
        </span>
      </button>

      <button id="restartButton" class="large-action" type="button">
        重新開始
        <span class="dwell-track" aria-hidden="true">
          <span class="dwell-fill"></span>
        </span>
      </button>
    </section>

    <p class="helper">
      玩法：先看物品並完成點數，再凝視「我數好了，找數字」，
      最後從大型數字卡中找出正確答案。
    </p>
  </main>

  <script>
    "use strict";

    const MATERIALS = {
      fruit: [
        { symbol: "🍎", name: "蘋果" },
        { symbol: "🍌", name: "香蕉" },
        { symbol: "🍊", name: "橘子" },
        { symbol: "🍇", name: "葡萄" },
        { symbol: "🍓", name: "草莓" },
        { symbol: "🍉", name: "西瓜" },
        { symbol: "🍐", name: "梨子" }
      ],

      vehicle: [
        { symbol: "🚗", name: "汽車" },
        { symbol: "🚌", name: "公車" },
        { symbol: "🚕", name: "計程車" },
        { symbol: "🚲", name: "腳踏車" },
        { symbol: "🚂", name: "火車" },
        { symbol: "✈️", name: "飛機" },
        { symbol: "🚢", name: "輪船" }
      ],

      food: [
        { symbol: "🍞", name: "麵包" },
        { symbol: "🍙", name: "飯糰" },
        { symbol: "🍕", name: "披薩" },
        { symbol: "🍔", name: "漢堡" },
        { symbol: "🥟", name: "水餃" },
        { symbol: "🍪", name: "餅乾" },
        { symbol: "🧁", name: "杯子蛋糕" }
      ]
    };

    const rangeSelect = document.getElementById("rangeSelect");
    const categorySelect = document.getElementById("categorySelect");
    const dwellSelect = document.getElementById("dwellSelect");
    const gazeToggle = document.getElementById("gazeToggle");

    const roundValue = document.getElementById("roundValue");
    const scoreValue = document.getElementById("scoreValue");
    const streakValue = document.getElementById("streakValue");

    const stageBanner = document.getElementById("stageBanner");
    const taskLabel = document.getElementById("taskLabel");
    const targetContent = document.getElementById("targetContent");

    const countStage = document.getElementById("countStage");
    const numberSearch = document.getElementById("numberSearch");
    const numberGrid = document.getElementById("numberGrid");
    const feedback = document.getElementById("feedback");

    const countAgainButton = document.getElementById("countAgainButton");
    const findNumberButton = document.getElementById("findNumberButton");
    const backToCountButton = document.getElementById("backToCountButton");
    const restartButton = document.getElementById("restartButton");

    const state = {
      round: 1,
      score: 0,
      streak: 0,
      targetNumber: 1,
      category: "fruit",
      material: MATERIALS.fruit[0],
      stage: "count",
      locked: false,
      dwellTimer: null,
      activeButton: null,
      nextTimer: null
    };

    function randomInteger(maximum) {
      return Math.floor(Math.random() * maximum) + 1;
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const result = [...items];

      for (let index = result.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[randomIndex]] =
          [result[randomIndex], result[index]];
      }

      return result;
    }

    function chooseCategory() {
      if (categorySelect.value !== "random") {
        return categorySelect.value;
      }

      return randomItem(["fruit", "vehicle", "food"]);
    }

    function updateStats() {
      roundValue.textContent = String(state.round);
      scoreValue.textContent = String(state.score);
      streakValue.textContent = String(state.streak);
    }

    function createSymbolRow(quantity, material) {
      const row = document.createElement("div");
      row.className = "symbol-row";
      row.setAttribute("aria-label", `${quantity}個${material.name}`);

      for (let index = 0; index < quantity; index += 1) {
        const symbol = document.createElement("span");
        symbol.className = "target-symbol";
        symbol.textContent = material.symbol;
        symbol.setAttribute("aria-hidden", "true");
        row.appendChild(symbol);
      }

      return row;
    }

    function clearDwell() {
      if (state.dwellTimer !== null) {
        window.clearTimeout(state.dwellTimer);
        state.dwellTimer = null;
      }

      if (state.activeButton !== null) {
        state.activeButton.classList.remove("is-gazing");

        const fill = state.activeButton.querySelector(".dwell-fill");
        if (fill) {
          fill.style.animationDuration = "";
        }

        state.activeButton = null;
      }
    }

    function startDwell(button, action) {
      if (!gazeToggle.checked || button.disabled || state.locked) {
        return;
      }

      clearDwell();

      const milliseconds = Number(dwellSelect.value);
      const fill = button.querySelector(".dwell-fill");

      state.activeButton = button;

      if (fill) {
        fill.style.animationDuration = `${milliseconds}ms`;
      }

      button.classList.add("is-gazing");

      state.dwellTimer = window.setTimeout(() => {
        clearDwell();
        action();
      }, milliseconds);
    }

    function bindDwell(button, action) {
      button.addEventListener("pointerenter", () => {
        startDwell(button, action);
      });

      button.addEventListener("pointerleave", clearDwell);
      button.addEventListener("pointercancel", clearDwell);

      button.addEventListener("focus", () => {
        startDwell(button, action);
      });

      button.addEventListener("blur", clearDwell);

      button.addEventListener("click", () => {
        clearDwell();
        action();
      });
    }

    function setFeedback(message, type = "neutral") {
      feedback.className = "feedback";

      if (type === "correct") {
        feedback.classList.add("correct");
      } else if (type === "wrong") {
        feedback.classList.add("wrong");
      }

      feedback.textContent = message;
    }

    function renderTarget() {
      targetContent.innerHTML = "";
      taskLabel.textContent = `這裡有幾個${state.material.name}？`;
      targetContent.appendChild(
        createSymbolRow(state.targetNumber, state.material)
      );
    }

    function renderNumberChoices() {
      numberGrid.innerHTML = "";

      // 每一題固定顯示 3 個不重複的數字：
      // 1 個正確答案，加上 2 個干擾選項。
      const values = [state.targetNumber];
      const allNumbers = shuffle([1, 2, 3, 4, 5]);

      for (const number of allNumbers) {
        if (number !== state.targetNumber && values.length < 3) {
          values.push(number);
        }
      }

      const shuffledValues = shuffle(values);

      for (const value of shuffledValues) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "number-button";
        button.dataset.value = String(value);
        button.setAttribute("aria-label", `數字${value}`);
        button.textContent = String(value);

        const track = document.createElement("span");
        track.className = "dwell-track";
        track.setAttribute("aria-hidden", "true");

        const fill = document.createElement("span");
        fill.className = "dwell-fill";

        track.appendChild(fill);
        button.appendChild(track);

        bindDwell(button, () => submitNumber(button));
        numberGrid.appendChild(button);
      }
    }

    function showCountStage() {
      clearDwell();
      state.stage = "count";
      state.locked = false;

      stageBanner.textContent = "第一步：慢慢數一數";
      countStage.style.display = "grid";
      numberSearch.classList.remove("visible");

      setFeedback("請先慢慢數一數。");
    }

    function showNumberStage() {
      clearDwell();
      state.stage = "number";
      state.locked = false;

      stageBanner.textContent = "第二步：找出正確的數字";
      countStage.style.display = "none";
      numberSearch.classList.add("visible");

      setFeedback("請找出和數量一樣的數字。");
    }

    function submitNumber(button) {
      if (state.locked || button.disabled) {
        return;
      }

      const selected = Number(button.dataset.value);

      if (selected === state.targetNumber) {
        state.locked = true;
        state.score += 1;
        state.streak += 1;
        button.classList.add("correct");

        setFeedback(
          `答對了！有 ${state.targetNumber} 個${state.material.name}。`,
          "correct"
        );

        updateStats();

        state.nextTimer = window.setTimeout(() => {
          state.round += 1;
          newRound();
        }, 1600);
      } else {
        state.streak = 0;
        button.classList.add("wrong");
        button.disabled = true;

        setFeedback(
          "這個數字不一樣，請再看一次數量。",
          "wrong"
        );

        updateStats();
      }
    }

    function newRound() {
      clearDwell();

      if (state.nextTimer !== null) {
        window.clearTimeout(state.nextTimer);
        state.nextTimer = null;
      }

      state.targetNumber = randomInteger(Number(rangeSelect.value));
      state.category = chooseCategory();
      state.material = randomItem(MATERIALS[state.category]);
      state.locked = false;

      updateStats();
      renderTarget();
      renderNumberChoices();
      showCountStage();
    }

    function restartGame() {
      state.round = 1;
      state.score = 0;
      state.streak = 0;
      newRound();
    }

    bindDwell(countAgainButton, () => {
      setFeedback(
        `請從左到右慢慢數：1、2……共有幾個${state.material.name}？`
      );
    });

    bindDwell(findNumberButton, showNumberStage);
    bindDwell(backToCountButton, showCountStage);
    bindDwell(restartButton, restartGame);

    rangeSelect.addEventListener("change", restartGame);
    categorySelect.addEventListener("change", restartGame);
    dwellSelect.addEventListener("change", clearDwell);
    gazeToggle.addEventListener("change", clearDwell);

    restartGame();
  </script>
</body>
</html>
