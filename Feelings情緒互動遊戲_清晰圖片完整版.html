<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feelings 情緒互動遊戲</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:#f4fbff;color:#16324f}
.app{max-width:1200px;margin:auto;padding:16px}
h1{margin:0 0 4px;font-size:clamp(30px,4vw,48px);font-weight:900}
.sub{margin:0 0 14px;font-size:17px;line-height:1.6}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:48px;border:0;border-radius:14px;padding:10px 18px;font-size:17px;font-weight:900;cursor:pointer;background:#d9ecff;color:#205a8b}
.tab.active{background:#2f7fd8;color:#fff}
.panel{background:#fff;border:1px solid #cfe0ed;border-radius:20px;padding:18px}
.hidden{display:none!important}
.status{padding:10px 12px;border-radius:12px;background:#edf7ff;border:1px solid #cfe0ed;font-weight:800;margin-bottom:14px}
.big-card{max-width:360px;margin:0 auto 16px;border:2px solid #8db7d8;border-radius:18px;overflow:hidden;background:#fff}
.big-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.qtitle{text-align:center;font-size:22px;font-weight:900;margin:8px 0 14px}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:780px;margin:auto}
.option{min-height:76px;border:2px solid #b8d3e6;border-radius:16px;background:#fff;font-size:22px;font-weight:900;cursor:pointer;color:#17324d}
.option.correct{background:#e7f8e7;border-color:#50a85a}
.option.wrong{background:#fde8e8;border-color:#d85c5c}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{min-height:46px;border:0;border-radius:13px;padding:10px 18px;font-size:16px;font-weight:900;cursor:pointer;color:#fff}
.next{background:#2f7fd8} .reset{background:#727b84} .check{background:#2fa35e}
.drag-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.faces,.words{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.face{border:2px dashed #8db7d8;border-radius:16px;padding:8px;background:#fafdff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.face img{width:100%;max-width:190px;aspect-ratio:1/1;object-fit:cover;border-radius:12px}
.dropzone{width:100%;min-height:50px;margin-top:8px;border:2px dashed #9eb7c9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#71879a;padding:6px;text-align:center}
.dropzone.over{background:#e8f4ff}
.dropzone.done{border-style:solid;background:#e9f8ea;color:#26753a}
.word{min-height:78px;border:2px solid #b9d2e4;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;cursor:grab;user-select:none;padding:10px;text-align:center}
.word.selected{outline:4px solid #2f7fd8;outline-offset:2px}
.word.used{opacity:.25;pointer-events:none}
.round-title{font-size:20px;font-weight:900;margin:0 0 12px}
.note{margin-top:12px;font-size:14px;color:#5e7487}
.score{text-align:center;font-size:18px;font-weight:900;margin-top:10px}
@media(max-width:760px){.options{grid-template-columns:1fr}.drag-layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>😊 Feelings 情緒互動遊戲</h1>
<p class="sub">使用你這張較清楚的 16 張表情照片。先做「看表情三選一」，再進階做「拖曳配對」。</p>

<div class="tabs">
<button id="tabQuiz" class="tab active" type="button">① 三選一</button>
<button id="tabDrag" class="tab" type="button">② 拖曳配對</button>
</div>

<section id="quizPanel" class="panel">
  <div id="quizStatus" class="status">第 1 / 16 題</div>
  <div class="big-card"><img id="quizImg" alt="情緒表情"></div>
  <div class="qtitle">這個表情比較接近哪一種情緒？</div>
  <div id="options" class="options"></div>
  <div class="score" id="quizScore">得分：0</div>
  <div class="controls">
    <button id="nextBtn" class="btn next" type="button">下一題</button>
    <button id="restartQuiz" class="btn reset" type="button">重新開始</button>
  </div>
</section>

<section id="dragPanel" class="panel hidden">
  <div id="dragStatus" class="status">第 1 組，共 4 張表情</div>
  <p class="round-title">把右邊的情緒詞拖到左邊正確的表情下面。</p>
  <div class="drag-layout">
    <div id="faces" class="faces"></div>
    <div>
      <div id="words" class="words"></div>
      <div class="controls">
        <button id="nextRound" class="btn next" type="button">下一組</button>
        <button id="restartDrag" class="btn reset" type="button">重新開始</button>
      </div>
      <div class="note">平板或滑鼠拖曳不方便時，也可以「先點情緒詞 → 再點表情下方框框」。</div>
    </div>
  </div>
</section>
</div>

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const quizPanel=document.getElementById("quizPanel");
const dragPanel=document.getElementById("dragPanel");
const tabQuiz=document.getElementById("tabQuiz");
const tabDrag=document.getElementById("tabDrag");

function showMode(mode){
  const q=mode==="quiz";
  quizPanel.classList.toggle("hidden",!q);
  dragPanel.classList.toggle("hidden",q);
  tabQuiz.classList.toggle("active",q);
  tabDrag.classList.toggle("active",!q);
}
tabQuiz.onclick=()=>showMode("quiz");
tabDrag.onclick=()=>showMode("drag");

let quizOrder=[], qi=0, answered=false, score=0;

function resetQuiz(){
  quizOrder=shuffle(cards); qi=0; score=0;
  document.getElementById("quizScore").textContent="得分：0";
  loadQuiz();
}

function loadQuiz(){
  answered=false;
  const cur=quizOrder[qi];
  document.getElementById("quizImg").src=cur.img;
  document.getElementById("quizStatus").textContent=`第 ${qi+1} / ${quizOrder.length} 題`;

  const wrong=shuffle(cards.filter(x=>x.zh!==cur.zh)).slice(0,2);
  const choices=shuffle([cur,...wrong]);
  const box=document.getElementById("options");
  box.innerHTML="";
  choices.forEach(ch=>{
    const b=document.createElement("button");
    b.type="button"; b.className="option"; b.textContent=ch.zh;
    b.onclick=()=>{
      if(answered)return;
      if(ch.zh===cur.zh){
        answered=true; score++;
        b.classList.add("correct");
        document.getElementById("quizStatus").textContent=`✅ 答對了！${cur.en} = ${cur.zh}`;
        document.getElementById("quizScore").textContent=`得分：${score}`;
      }else{
        b.classList.add("wrong");
        document.getElementById("quizStatus").textContent="❌ 再看一次表情。";
        setTimeout(()=>b.classList.remove("wrong"),700);
      }
    };
    box.appendChild(b);
  });
}

document.getElementById("nextBtn").onclick=()=>{
  qi++;
  if(qi>=quizOrder.length){
    document.getElementById("quizStatus").textContent=`🎉 完成！總得分 ${score} / ${quizOrder.length}`;
    qi=0;
  }
  loadQuiz();
};
document.getElementById("restartQuiz").onclick=resetQuiz;

let dragOrder=[], round=0, selectedWord=null, placedCount=0;

function resetDrag(){
  dragOrder=shuffle(cards); round=0; loadRound();
}

function loadRound(){
  selectedWord=null; placedCount=0;
  const group=dragOrder.slice(round*4, round*4+4);
  document.getElementById("dragStatus").textContent=`第 ${round+1} / 4 組`;

  const faces=document.getElementById("faces");
  faces.innerHTML="";
  group.forEach(card=>{
    const f=document.createElement("div");
    f.className="face";
    f.innerHTML=`<img src="${card.img}" alt="情緒表情"><div class="dropzone" data-answer="${card.zh}">把情緒詞放這裡</div>`;
    const dz=f.querySelector(".dropzone");
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");const value=e.dataTransfer.getData("text/plain");if(value)tryDrop(value,dz)});
    dz.addEventListener("click",()=>{if(selectedWord)tryDrop(selectedWord,dz)});
    faces.appendChild(f);
  });

  const words=document.getElementById("words");
  words.innerHTML="";
  shuffle(group).forEach(card=>{
    const w=document.createElement("button");
    w.type="button"; w.className="word"; w.textContent=card.zh;
    w.draggable=true; w.dataset.value=card.zh;
    w.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",card.zh));
    w.addEventListener("click",()=>{
      selectedWord=selectedWord===card.zh?null:card.zh;
      document.querySelectorAll(".word").forEach(x=>x.classList.toggle("selected",x.dataset.value===selectedWord));
    });
    words.appendChild(w);
  });
}

function tryDrop(value,dz){
  if(dz.classList.contains("done"))return;
  if(value===dz.dataset.answer){
    dz.textContent="✓ "+value; dz.classList.add("done");
    const word=[...document.querySelectorAll(".word")].find(x=>x.dataset.value===value);
    if(word)word.classList.add("used");
    selectedWord=null;
    document.querySelectorAll(".word").forEach(x=>x.classList.remove("selected"));
    placedCount++;
    document.getElementById("dragStatus").textContent=placedCount===4?"🎉 這一組全部完成！":`✅ 已完成 ${placedCount} / 4`;
  }else{
    document.getElementById("dragStatus").textContent="❌ 再觀察一次，這個情緒詞不符合。";
  }
}

document.getElementById("nextRound").onclick=()=>{round=(round+1)%4;loadRound()};
document.getElementById("restartDrag").onclick=resetDrag;

resetQuiz();
resetDrag();
})();
</script>
</body>
</html>
